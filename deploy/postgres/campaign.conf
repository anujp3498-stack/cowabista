# PostgreSQL 16 settings for the campaign transport (Host S). Drop into conf.d (include_dir) or merge into
# postgresql.conf; restart required for shared_preload_libraries and max_connections. Values marked REQUIRED come
# from the measured budget in docs/campaign-transport-operations.md and the benchmark kit; the rest are
# recommendations that do not change query behaviour.

# REQUIRED: 26 connections per cell (20 claim/supply + 6 settlement) x (cells + 1 replacement) + tooling.
# Two cells: 26 x 3 + 20 = 98. Set with headroom, or front the cells with a pooler in session mode.
max_connections = 120

# REQUIRED for statement latency in the benchmark analyzers and for production monitoring.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
track_io_timing = on

# Lock and slow-statement visibility: settlement serializes on the campaign row; waiters longer than
# deadlock_timeout are logged, which is the direct signal for the tracked settlement-lock item.
log_lock_waits = on
deadlock_timeout = 1s
log_min_duration_statement = 250ms

# Durability as in production. Do not relax synchronous_commit to make a benchmark look better; the measured
# figures (2.7-3.4 KB WAL per message, 0.03-0.05 commits per message) assume the default.
synchronous_commit = on
wal_level = replica
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9

# Memory: size to the host; these are starting points for a dedicated 8 GB database host.
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 256MB

# Reaper and settlement rely on statement_timestamp(); keep the server clock NTP-synchronised (runbook: <= 50 ms).
