# Redis 7 for the campaign transport (Host S). Holds phone ownership leases (5 s TTL), pacing timelines and the
# per-phone streams of prepared envelopes. PostgreSQL stays authoritative for every job, but a Redis data loss
# stalls phones until every cell is restarted (docs/campaign-transport-operations.md section 4), so persistence is
# mandatory and eviction is forbidden. Application semantics are untouched by anything here.

bind 0.0.0.0
protected-mode yes
port 6379
requirepass CHANGE_ME
tcp-keepalive 60
timeout 0
# 2 clients per cell plus a replacement plus tooling; the default 10000 is fine, stated here so it is deliberate.
maxclients 10000

# Persistence: AOF with per-second fsync so a restart replays streams and leases with at most ~1 s of loss, plus an
# RDB snapshot at least every minute as the second copy. Without both, every restart is a data-loss event.
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes
save 60 1
save 300 100
stop-writes-on-bgsave-error yes
rdbcompression yes
dir /var/lib/redis

# Memory: streams hold at most 4,096 unacknowledged entries per phone plus the pacing timelines; size well above
# the observed working set and NEVER evict: an evicted stream entry is a published job the owner keeps leased.
maxmemory 2gb
maxmemory-policy noeviction

# Restart behaviour: on start Redis loads the AOF (appendonly.aof / appenddirname) before accepting writes; cells
# started earlier wait in their guard (pg_isready/PING with retries) and then take ownership normally.
appenddirname "appendonlydir"

# Observability
latency-monitor-threshold 10
slowlog-log-slower-than 10000
slowlog-max-len 512
loglevel notice
