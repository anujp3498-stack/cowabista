name: CI

# Independent verification of typecheck, builds, unit tests and the full API regression, against throwaway
# services on the runner. It never deploys, never touches production or Host S, and cannot reach Meta: tests use
# their own fake Graph server, and the Graph hosts are additionally blackholed below.

on:
  pull_request:
    branches: [wabista-nexus-v2]
  push:
    branches: [wabista-nexus-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BLOCKED_META_HOSTS: graph.facebook.com graph-video.facebook.com rupload.facebook.com www.facebook.com facebook.com

jobs:
  static:
    name: Typecheck, builds, unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Blackhole Meta hosts
        run: for host in $BLOCKED_META_HOSTS; do echo "0.0.0.0 $host" | sudo tee -a /etc/hosts > /dev/null; done
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/check-gate-b-scope.mjs
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/wabista-nexus run build
      - run: pnpm --filter @workspace/wabista-nexus run test:unit
      - run: pnpm --filter @workspace/db run test:guard

  reproducible-build:
    # deploy/cutover/FINAL-SEQUENCE.md §6: builds at three absolute paths (the release staging path
    # /opt/cowabista.next among them; on this throwaway runner, not a server) and with Node 22.22.2 and 22.23.3
    # must be byte-identical. Also prints the Gate B measuredFilesSha256 of the commit.
    name: Reproducible build (three paths, Node 22.22.2 and 22.23.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: first
      - uses: actions/checkout@v4
        with:
          path: second/at/another/depth
      - uses: actions/checkout@v4
        with:
          path: node-22.23.3
      - name: Copy a pristine checkout to /opt/cowabista.next
        run: |
          sudo mkdir -p /opt/cowabista.next
          sudo chown "$(id -u):$(id -g)" /opt/cowabista.next
          cp -a first/. /opt/cowabista.next/
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: first/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm
          cache-dependency-path: first/pnpm-lock.yaml
      - name: Build three paths with Node 22.22.2
        run: |
          node --version
          for dir in first second/at/another/depth /opt/cowabista.next; do
            (cd "$dir" && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/wabista-nexus run build)
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: Build a fourth checkout with Node 22.23.3
        run: |
          node --version
          (cd node-22.23.3 && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/wabista-nexus run build)
      - name: Compare release-artifact hashes (FINAL-SEQUENCE §6 rows) and every dist file
        run: |
          gate_b="$(node first/.github/scripts/gate-b-hash.mjs first)"
          first/.github/scripts/release-hashes.sh first > first.sums
          {
            echo "### Release candidate ${GITHUB_SHA}"
            echo
            echo "Gate B: \`${gate_b}\`"
            echo
            echo '```'
            cat first.sums
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Gate B: ${gate_b}"
          cat first.sums
          (cd first && find artifacts/api-server/dist artifacts/wabista-nexus/dist -type f | LC_ALL=C sort | xargs sha256sum) > first.all
          for dir in second/at/another/depth /opt/cowabista.next node-22.23.3; do
            echo "== $dir"
            first/.github/scripts/release-hashes.sh "$dir" | diff -u first.sums -
            (cd "$dir" && find artifacts/api-server/dist artifacts/wabista-nexus/dist -type f | LC_ALL=C sort | xargs sha256sum) | diff -u first.all -
            if grep -rlF "$(cd "$dir" && pwd)" "$dir/artifacts/api-server/dist"; then echo "a bundle embeds its build directory" >&2; exit 1; fi
          done
          echo "All $(wc -l < first.all) dist files are byte-identical across four builds (three paths, two Node versions)."

  api-suites:
    name: API suites (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CAMPAIGN_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      BETTER_AUTH_URL: http://localhost:24902
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Blackhole Meta hosts
        run: for host in $BLOCKED_META_HOSTS; do echo "0.0.0.0 $host" | sudo tee -a /etc/hosts > /dev/null; done
      - run: pnpm install --frozen-lockfile
      # The runner's own Redis 7, not a service container: test:prepared-broker starts its own redis-server
      # binary (docs/DEVELOPMENT.md lists Redis 7 for the Redis-backed suites); the others use this instance.
      - name: Install a throwaway local Redis 7
        run: |
          sudo apt-get install -y --no-install-recommends redis-server || { sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server; }
          sudo systemctl start redis-server
          redis-server --version
          redis-cli -h 127.0.0.1 -p 6379 ping
      # The runner's own PostgreSQL on loopback. A service container is not used: the schema guard
      # (lib/db/scripts/assert-safe-database.mjs) rightly refuses a server that reports a non-loopback address.
      - name: Start a throwaway local PostgreSQL 16 and role
        run: |
          sudo systemctl start postgresql.service
          pg_lsclusters
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -q -c "CREATE ROLE wabista LOGIN CREATEDB PASSWORD '$password'"
          echo "DATABASE_URL=postgresql://wabista:$password@localhost:5432/wabista_ci" >> "$GITHUB_ENV"
          secret="$(openssl rand -base64 48)"
          echo "::add-mask::$secret"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Create and push the disposable database (guarded commands only)
        env:
          WABISTA_DB_TARGET: disposable-local
        run: |
          pnpm --filter @workspace/db run reset-disposable-local
          pnpm --filter @workspace/db run push
      - name: Run API suites
        env:
          SUITE_SHARD: ${{ matrix.shard }}/4
          SUITE_LOG_DIR: ${{ runner.temp }}/suite-logs
        run: node .github/scripts/run-api-suites.mjs
      - name: Upload suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-suite-logs-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/suite-logs
          retention-days: 14
