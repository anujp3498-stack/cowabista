openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: me
    description: Current user
  - name: organizations
    description: Organizations (tenants) and workspace switching
  - name: members
    description: Organization members and roles
  - name: contacts
    description: Contacts
  - name: phone-numbers
    description: Connected WhatsApp phone numbers
  - name: templates
    description: Message templates
  - name: campaigns
    description: Campaigns
  - name: campaign-routes
    description: Rocket Engine campaign routes
  - name: campaign-engine
    description: Campaign lifecycle, imports, mappings and monitoring
  - name: message-studio
    description: V2-05B Message Studio (senders, templates, mappings, media, preview, presets, test send)
  - name: delivery
    description: V2-06B Delivery step (distribution, speed) and the structured campaign preflight
  - name: overview
    description: Dashboard overview stats
  - name: whatsapp-integration
    description: Tenant WhatsApp provider integration and synchronization
  - name: whatsapp-webhook
    description: Public Meta WhatsApp webhook
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: "Readiness for campaign operations (200 only after required initialization completed and the campaign runtime started)"
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Not ready (initializing, failed initialization, shut down, or database unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /me:
    get:
      operationId: getCurrentUser
      tags: [me]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations the current user belongs to
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"

  /organizations/{organizationId}:
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Rename an organization (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /organizations/{organizationId}/activate:
    post:
      operationId: activateOrganization
      tags: [organizations]
      summary: Switch the current active organization (workspace switcher)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: Organizations after activation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"

  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List members of the current organization
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: inviteMember
      tags: [members]
      summary: Invite a user to the current organization by email (owner/admin only). Adds them immediately if they already have an account, otherwise creates a pending invitation that is accepted automatically the first time that email signs up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Member added, or a pending invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteMemberResult"

  /invitations:
    get:
      operationId: listInvitations
      tags: [members]
      summary: List pending invitations for the current organization (owner/admin only)
      responses:
        "200":
          description: List of pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"

  /invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      tags: [members]
      summary: Revoke a pending invitation (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/InvitationIdParam"
      responses:
        "204":
          description: Revoked

  /invite-info/{token}:
    get:
      operationId: getInvitationPreview
      tags: [members]
      summary: Public lookup of a shareable invite link's basic info (no auth required). Never grants membership by itself.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "404":
          description: No invitation found for this token

  /members/{memberId}:
    patch:
      operationId: updateMemberRole
      tags: [members]
      summary: Change a member's role (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/MemberIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove a member from the current organization (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/MemberIdParam"
      responses:
        "204":
          description: Removed

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List contacts in the current organization
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Page of contacts
          content:
            application/json:
              schema:
                type: object
                required: [total, limit, offset, contacts]
                properties:
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  contacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a contact (owner/admin/manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{contactId}:
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact (owner/admin/manager only)
      parameters:
        - $ref: "#/components/parameters/ContactIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Delete a contact (owner/admin/manager only)
      parameters:
        - $ref: "#/components/parameters/ContactIdParam"
      responses:
        "204":
          description: Deleted

  /phone-numbers:
    get:
      operationId: listPhoneNumbers
      tags: [phone-numbers]
      summary: List phone numbers in the current organization
      responses:
        "200":
          description: List of phone numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhoneNumber"
    post:
      operationId: createPhoneNumber
      tags: [phone-numbers]
      summary: Connect a phone number (owner/admin/manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneNumberInput"
      responses:
        "201":
          description: Created phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneNumber"

  /phone-numbers/{phoneNumberId}:
    patch:
      operationId: updatePhoneNumber
      tags: [phone-numbers]
      summary: Update a phone number (owner/admin/manager only)
      parameters:
        - $ref: "#/components/parameters/PhoneNumberIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneNumberUpdate"
      responses:
        "200":
          description: Updated phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneNumber"
    delete:
      operationId: deletePhoneNumber
      tags: [phone-numbers]
      summary: Delete a phone number (owner/admin/manager only)
      parameters:
        - $ref: "#/components/parameters/PhoneNumberIdParam"
      responses:
        "204":
          description: Deleted

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List message templates in the current organization
      description: |
        Organization scoped. All filters are optional; without them every
        template row is returned exactly as before. Sample rows are included
        unless includeSample is false so legacy callers are unchanged.
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: language
          in: query
          required: false
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: wabaId
          in: query
          required: false
          schema: { type: integer }
        - name: includeSample
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      operationId: createTemplate
      tags: [templates]
      summary: Create a template (owner/admin/manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"

  /templates/{templateId}:
    patch:
      operationId: updateTemplate
      tags: [templates]
      summary: Update a local template (owner/admin/manager only)
      parameters:
        - $ref: "#/components/parameters/TemplateIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateUpdate"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          description: Template not found in this organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateMutationError" }
        "409":
          description: The template is synchronised from Meta and cannot be edited locally
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateMutationError" }
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: Delete a template (owner/admin/manager only)
      parameters:
        - $ref: "#/components/parameters/TemplateIdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Template not found in this organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateMutationError" }
        "409":
          description: >-
            The template is synchronised from Meta (code provider_backed) or is
            still referenced by a campaign selection, mapping, route, job or
            allocation (code referenced); nothing was deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateMutationError" }

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns in the current organization
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign (owner/admin/manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "200":
          description: "Replayed the Draft previously created with the same creationKey (nothing new was created)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/list:
    get:
      operationId: listCampaignsPage
      tags: [campaigns]
      summary: Paged, searchable campaign list (keyset by id, newest first)
      parameters:
        - name: cursor
          in: query
          required: false
          description: Return campaigns with an id lower than this value (the previous page's nextCursor).
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: Page size, 1-100 (default 25).
          schema:
            type: integer
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match on campaign name.
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Draft, Ready, Scheduled, Running, Paused, Completed, Cancelled, Failed]
      responses:
        "200":
          description: Page of campaigns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignsPage"

  /campaigns/{campaignId}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get one campaign in the current organization
      parameters:
        - $ref: "#/components/parameters/CampaignIdParam"
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign (owner/admin/manager only)
      parameters:
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "409":
          description: "Stale revision (code stale_revision, the current campaign is in campaign), or a status change attempted outside the actions endpoint"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignConflictError"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign (owner/admin/manager only)
      parameters:
        - $ref: "#/components/parameters/CampaignIdParam"
      responses:
        "204":
          description: Deleted

  /campaign-routes:
    get:
      operationId: listCampaignRoutes
      tags: [campaign-routes]
      summary: List Rocket Engine campaign routes in the current organization
      parameters:
        - name: campaignId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of campaign routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignRoute"
    post:
      operationId: createCampaignRoute
      tags: [campaign-routes]
      summary: Create a campaign route (owner/admin/manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignRouteInput"
      responses:
        "201":
          description: Created campaign route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignRoute"

  /organizations/{organizationId}/campaigns/{campaignId}/rocket-setup:
    put:
      operationId: configureRocketCampaign
      tags: [campaign-engine]
      summary: Configure a campaign's multi-number, multi-template Rocket setup
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RocketCampaignSetupInput"
      responses:
        "200":
          description: Rocket campaign setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RocketCampaignSetup"

  /suppressions:
    get:
      operationId: listSuppressions
      tags: [suppressions]
      summary: List do-not-contact suppressions in the current organization
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Page of suppressions
          content:
            application/json:
              schema:
                type: object
                required: [total, limit, offset, suppressions]
                properties:
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  suppressions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Suppression"
    post:
      operationId: createSuppression
      tags: [suppressions]
      summary: Manually add a phone number to the do-not-contact list (owner/admin/manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuppressionInput"
      responses:
        "201":
          description: Created (or refreshed) suppression
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suppression"

  /suppressions/{suppressionId}:
    delete:
      operationId: deleteSuppression
      tags: [suppressions]
      summary: Remove a phone number from the do-not-contact list (owner/admin/manager only)
      parameters:
        - $ref: "#/components/parameters/SuppressionIdParam"
      responses:
        "204":
          description: Deleted

  /campaign-routes/{routeId}:
    patch:
      operationId: updateCampaignRoute
      tags: [campaign-routes]
      summary: Update a campaign route (owner/admin/manager only)
      parameters:
        - $ref: "#/components/parameters/RouteIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignRouteUpdate"
      responses:
        "200":
          description: Updated campaign route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignRoute"
    delete:
      operationId: deleteCampaignRoute
      tags: [campaign-routes]
      summary: Delete a campaign route (owner/admin/manager only)
      parameters:
        - $ref: "#/components/parameters/RouteIdParam"
      responses:
        "204":
          description: Deleted

  /overview/stats:
    get:
      operationId: getOverviewStats
      tags: [overview]
      summary: Get headline dashboard metrics for the current organization
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewStats"

  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get organization-wide delivery/read/failure rate KPIs
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /analytics/delivery-trends:
    get:
      operationId: getDeliveryTrends
      tags: [analytics]
      summary: Get daily sent/delivered/read/failed message counts for the current organization
      parameters:
        - name: days
          in: query
          required: false
          description: Number of trailing days to include (default 30, max 90)
          schema:
            type: integer
      responses:
        "200":
          description: Delivery trends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryTrends"

  /analytics/route-health:
    get:
      operationId: getRouteHealth
      tags: [analytics]
      summary: Get per-phone-number delivery/failure breakdown across all campaigns in the current organization
      responses:
        "200":
          description: Route health breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteHealth"

  /organizations/{organizationId}/campaigns/{campaignId}/actions:
    post:
      operationId: transitionCampaign
      tags: [campaign-engine]
      summary: Launch, plan, schedule, execute, pause, resume, cancel, or emergency-kill a campaign
      description: >-
        Rocket Campaign Engine lifecycle action. `plan` validates readiness and freezes an immutable
        execution snapshot (routes, TPS/provider-cap evidence, templates, mappings) plus a deterministic
        per-contact allocation, moving Draft -> Ready (idempotent: replanning a Ready campaign supersedes
        the prior plan). `execute` creates any campaign_jobs still missing from the active plan's
        allocation and moves Ready/Scheduled -> Running; it is idempotent and safe to retry after a
        partial failure or restart. `schedule` requires Ready and a `scheduledAt`; the runtime executes
        the frozen plan automatically once due. `reopen` (V2-05A) moves a Ready campaign that has
        no execution history (no jobs, no provider work) back to Draft and supersedes its active plan
        so the audience or setup can be edited again; it is refused once any job exists and is never
        applied to Paused/Running/Scheduled campaigns. Idempotent on a Draft campaign.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignActionInput"
      responses:
        "200":
          description: Transitioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignLifecycle"

  /organizations/{organizationId}/campaigns/{campaignId}/imports:
    get:
      operationId: listContactImports
      tags: [campaign-engine]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      responses:
        "200":
          description: Import sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContactImportSession" }
    post:
      operationId: streamContactImport
      tags: [campaign-engine]
      summary: Stream a CSV body into a campaign
      description: Send text/csv without multipart buffering. Supply import metadata in headers.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
        - name: idempotency-key
          in: header
          required: true
          schema: { type: string }
        - name: x-file-name
          in: header
          required: true
          schema: { type: string }
        - name: x-phone-column
          in: header
          required: true
          schema: { type: string }
        - name: x-default-country-code
          in: header
          schema: { type: string }
        - name: x-import-operation
          in: header
          required: false
          description: >-
            `append` (default; adds rows to the active audience, deduplicated against it) or
            `replace` (stages a new audience generation that atomically replaces the current one when
            the upload completes; the current audience stays usable until then and remains if the
            upload fails or is cancelled). Clients written for the single-import flow keep working:
            their first import is an append into an empty audience.
          schema: { type: string, enum: [append, replace] }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
      responses:
        "202":
          description: "Stream processed (or replayed: an idempotency key whose import already completed returns that session unchanged)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactImportSession"
        "400":
          description: "Invalid CSV, header problem (duplicate/empty headers are disambiguated, a missing phone column is refused) or invalid metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignConflictError"
        "409":
          description: >-
            Lifecycle conflict. Codes: `reopen_required` (campaign is Ready; reopen it first),
            `not_draft` (any other non-Draft status, including Paused, which is never reset),
            `execution_history` (jobs or provider work exist; the audience is frozen),
            `import_in_progress` (another import is processing), `idempotency_mismatch` (the key was
            used with a different campaign or upload configuration), `fenced` (the import lost its
            session/generation fence mid-stream).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignConflictError"
        "413":
          description: CSV exceeds the size limit

  /organizations/{organizationId}/campaigns/{campaignId}/imports/sniff:
    post:
      operationId: sniffContactImport
      tags: [campaign-engine]
      summary: "Inspect the head of a CSV before importing it (headers, bounded sample, suggestions)"
      description: >-
        Reads a bounded prefix of the body (bytes, rows, field sizes and the returned sample are all
        capped server-side; anything beyond the cap is ignored and reported as `truncated`) with the
        same RFC-4180 streaming parser semantics as the import (quoted commas, embedded newlines,
        escaped quotes, CRLF, BOM, UTF-8 split across chunks). Returns the ordered, disambiguated
        column names the import will use, a small sample, a phone-column suggestion when exactly one
        header looks like a phone column, and a country-code decision: `not_needed` when every sampled
        phone is already international, otherwise `required` (the user must choose; no code is guessed).
        Never persists anything. Membership read.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Sniff result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsvSniffResult" }
        "400":
          description: "Empty body or invalid CSV inside the inspected prefix (a prefix cut mid-row by the byte cap is NOT invalid; it is reported as truncated)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignConflictError"
        "404":
          description: Campaign not found in this organization

  /organizations/{organizationId}/campaigns/{campaignId}/audience:
    get:
      operationId: getCampaignAudience
      tags: [campaign-engine]
      summary: "Audience summary for the Rocket Audience step (active generation counts, sessions, editability)"
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      responses:
        "200":
          description: Audience summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignAudience" }
        "404":
          description: Campaign not found in this organization

  /organizations/{organizationId}/campaigns/{campaignId}/imports/{importSessionId}/rejected.csv:
    get:
      operationId: downloadRejectedImportRows
      tags: [campaign-engine]
      summary: Download the exact rows one import rejected (Invalid or Suppressed), as CSV
      description: >-
        Streams every row from this import session with status Invalid or
        Suppressed, keyset-paginated server-side so it stays safe against
        very large imports. Duplicate rows are not included here; since
        V2-05A they are preserved with their original columns and served by
        the duplicates.csv download.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
        - $ref: "#/components/parameters/ImportSessionIdParam"
      responses:
        "200":
          description: CSV file of rejected rows
          content:
            text/csv:
              schema: { type: string, format: binary }
        "404":
          description: Import session not found under this org/campaign

  /organizations/{organizationId}/campaigns/{campaignId}/imports/{importSessionId}/duplicates.csv:
    get:
      operationId: downloadDuplicateImportRows
      tags: [campaign-engine]
      summary: Download every row one import classified as a duplicate, with its original columns
      description: >-
        Streams this session's duplicate occurrences (keyset by occurrence id, one page in memory)
        with the row number, classification (`duplicate_in_import` for a repeat inside the same
        upload, `duplicate_of_existing` for a number already in the audience from an earlier upload),
        the canonical row it duplicates (session, row number, status) and the original columns.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
        - $ref: "#/components/parameters/ImportSessionIdParam"
      responses:
        "200":
          description: CSV file of duplicate rows
          content:
            text/csv:
              schema: { type: string, format: binary }
        "404":
          description: Import session not found under this org/campaign

  /organizations/{organizationId}/campaigns/{campaignId}/contacts/search:
    post:
      operationId: searchCampaignContacts
      tags: [campaign-engine]
      summary: Keyset-paginated imported rows including invalid reporting
      description: >-
        Cursor-paginated by contact id (stable and unique across import
        sessions; rowNumber repeats per session) so a campaign with millions
        of imported rows never requires an expensive offset/count(*) scan or
        an unbounded response -- required to stay usable at the 10-20M
        contact scale this campaign engine targets. Only the active audience
        generation is returned. POST+body (not GET+query) to avoid an orval
        codegen naming collision between this operation's path params and
        query params.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchCampaignContactsInput" }
      responses:
        "200":
          description: Page of imported rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignContactsPage" }

  /organizations/{organizationId}/campaigns/{campaignId}/message-setup:
    get:
      operationId: getMessageSetup
      tags: [message-studio]
      summary: "Message Studio state: senders, templates, compatibility, mappings, media and what the current engine can run"
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      responses:
        "200":
          description: Message setup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageSetup" }
        "404":
          description: Campaign not found in this organization
    put:
      operationId: saveMessageSetup
      tags: [message-studio]
      summary: "Save senders, templates and per-template mappings (revision-fenced, lifecycle-fenced)"
      description: >-
        Replaces the campaign's sender selection, template selection and mappings in one transaction under the
        campaign lifecycle lock. Draft, or Ready with no execution history (its plan is superseded and it returns
        to Draft). Routes are derived for the current allocator (one template per number) only when that engine can
        run the selection; otherwise none are written and readiness explains why. Incomplete mappings may be saved;
        readiness and planning refuse them. Never plans, executes or sends.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageSetupInput" }
      responses:
        "200":
          description: Saved message setup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageSetup" }
        "400":
          description: Invalid selection or mappings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }
        "409":
          description: Stale revision or lifecycle conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }

  /organizations/{organizationId}/campaigns/{campaignId}/delivery-setup:
    get:
      operationId: getDeliverySetup
      tags: [delivery]
      summary: "Delivery step state: distribution, speed, per-number planned rates and estimate (server-resolved)"
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      responses:
        "200":
          description: Delivery setup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverySetup" }
        "404":
          description: Campaign not found in this organization
    put:
      operationId: saveDeliverySetup
      tags: [delivery]
      summary: "Save distribution and speed (revision-fenced, lifecycle-fenced)"
      description: >-
        Saves the distribution mode, delivery mode and advanced per-number rates in one transaction under the
        campaign lifecycle lock, fenced by the Message Studio revision (distribution and sender lanes are one
        setup). Draft, or Ready with no execution history (its plan is superseded and it returns to Draft).
        Sender lanes are re-derived (one per selected number). Never plans, executes or sends.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliverySetupInput" }
      responses:
        "200":
          description: Saved delivery setup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverySetup" }
        "400":
          description: Invalid distribution, speed or per-number rates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }
        "404":
          description: Campaign not found in this organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }
        "409":
          description: Stale revision or lifecycle conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }

  /organizations/{organizationId}/campaigns/{campaignId}/preflight:
    get:
      operationId: getCampaignPreflight
      tags: [delivery]
      summary: "Structured, read-only campaign preflight (recipients, senders, templates, distribution, speed, media, blockers, warnings)"
      description: >-
        Evaluates the current configuration without side effects: no plan, allocation, job, provider media binding,
        route change or provider request. Blocking rules are the same ones Plan enforces (shared readiness issues),
        plus the modern Rocket requirements (audience, distribution and speed chosen).
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      responses:
        "200":
          description: Preflight report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreflightReport" }
        "404":
          description: Campaign not found in this organization

  /organizations/{organizationId}/campaigns/{campaignId}/message-setup/preview:
    post:
      operationId: previewCampaignMessage
      tags: [message-studio]
      summary: "Resolve one template for one audience contact with the same resolver send preparation uses"
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessagePreviewInput" }
      responses:
        "200":
          description: Resolved preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePreview" }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }
        "404":
          description: Campaign, template or contact not found in this organization

  /organizations/{organizationId}/campaigns/{campaignId}/message-setup/apply-preset:
    post:
      operationId: applyMappingPreset
      tags: [message-studio]
      summary: "Copy a workspace mapping preset into the selected templates' mappings (no lasting link to the preset)"
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyPresetInput" }
      responses:
        "200":
          description: Saved message setup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageSetup" }
        "404":
          description: Preset or campaign not found in this organization
        "409":
          description: Stale revision or lifecycle conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }

  /organizations/{organizationId}/campaigns/{campaignId}/message-setup/test-send:
    post:
      operationId: testSendCampaignMessage
      tags: [message-studio]
      summary: "Send one test message from a selected number and template (not campaign execution)"
      description: >-
        Builds the payload with the real resolver and payload builder after the same ownership, number, credential,
        V2-04 compatibility, template, mapping and media checks sending uses; any failure is answered before a
        provider request. Creates no campaign job, allocation or delivery metric and never changes the campaign's
        status or plans. Recorded as a campaign audit entry (test_send_requested) with no payload or secret.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestSendInput" }
      responses:
        "200":
          description: Provider outcome (sent, failed or unknown)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestSendResult" }
        "400":
          description: Invalid recipient or unresolved mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }
        "409":
          description: Not selected, incompatible, credential inactive, media problem or recipient opted out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }

  /organizations/{organizationId}/campaigns/{campaignId}/media:
    get:
      operationId: listCampaignMedia
      tags: [message-studio]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      responses:
        "200":
          description: Ready media assets of this campaign
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CampaignMediaAsset" }
    post:
      operationId: uploadCampaignMedia
      tags: [message-studio]
      summary: "Upload one campaign media file (raw body; JPEG/PNG image, MP4/3GPP video or PDF document)"
      description: >-
        Streams the raw request body to object storage with size, type (declared and sniffed) and file-name checks.
        The campaign must be Draft or Ready without execution history. No provider call happens here; provider
        media ids are created server-side when a plan or a test send needs them.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
        - name: x-file-name
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignMediaAsset" }
        "400":
          description: Unsupported, oversized, empty or mislabelled file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }
        "409":
          description: Campaign not editable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }
        "503":
          description: Media storage is not configured on this server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }

  /organizations/{organizationId}/campaigns/{campaignId}/media/{mediaAssetId}:
    delete:
      operationId: deleteCampaignMedia
      tags: [message-studio]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
        - $ref: "#/components/parameters/MediaAssetIdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found in this campaign
        "409":
          description: Still used by a mapping, or the campaign is not editable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }

  /organizations/{organizationId}/campaigns/{campaignId}/media/{mediaAssetId}/content:
    get:
      operationId: downloadCampaignMedia
      tags: [message-studio]
      summary: "The asset's bytes, for previews (tenant-scoped, same-origin, never a public link)"
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
        - $ref: "#/components/parameters/MediaAssetIdParam"
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Not found in this campaign

  /organizations/{organizationId}/mapping-presets:
    get:
      operationId: listMappingPresets
      tags: [message-studio]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: Workspace presets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MappingPreset" }
    post:
      operationId: createMappingPreset
      tags: [message-studio]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MappingPresetInput" }
      responses:
        "201":
          description: Created preset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MappingPreset" }
        "400":
          description: Invalid preset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }
        "409":
          description: Name already used in this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }

  /organizations/{organizationId}/mapping-presets/{presetId}:
    put:
      operationId: updateMappingPreset
      tags: [message-studio]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/PresetIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MappingPresetInput" }
      responses:
        "200":
          description: Updated preset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MappingPreset" }
        "404":
          description: Not found in this workspace
    delete:
      operationId: deleteMappingPreset
      tags: [message-studio]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/PresetIdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found in this workspace

  /organizations/{organizationId}/campaigns/{campaignId}/template-mappings:
    get:
      operationId: getCampaignTemplateMappings
      tags: [campaign-engine]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      responses:
        "200":
          description: Mappings and compatibility report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateMappingReport" }
    put:
      operationId: replaceCampaignTemplateMappings
      tags: [campaign-engine]
      description: >-
        Legacy replacement of the template selection and mappings. Obeys the campaign setup lifecycle (V2-05B.1):
        allowed while Draft; on a Ready campaign with no execution history the Active plan is superseded and the
        campaign returns to Draft in the same transaction; refused (409) once any job exists, while an import is
        processing, or for Scheduled/Running/Paused/terminal campaigns. Frozen plans are never modified. Bumps the
        Message Studio revision and honours an optional one.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateMappingInput" }
      responses:
        "200":
          description: Persisted mappings and report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateMappingReport" }
        "409":
          description: "Lifecycle conflict (codes setup_locked, execution_history, import_in_progress) or stale_revision"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageStudioError" }

  /organizations/{organizationId}/campaigns/{campaignId}/template-mapping-image-upload:
    post:
      operationId: requestCampaignImageUpload
      tags: [campaign-engine]
      summary: Request a private image upload URL for template mapping
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignImageUploadInput" }
      responses:
        "200":
          description: Presigned private object upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignImageUpload" }

  /organizations/{organizationId}/campaigns/{campaignId}/plan:
    get:
      operationId: getCampaignPlan
      tags: [campaign-engine]
      summary: Read the campaign's active frozen execution plan (routes, templates, mappings)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      responses:
        "200":
          description: Active frozen plan summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignPlanSummary" }
        "404":
          description: Campaign has no active frozen plan yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /organizations/{organizationId}/campaigns/{campaignId}/plan/preview:
    post:
      operationId: previewCampaignPlanContact
      tags: [campaign-engine]
      summary: Resolve exactly what one contact under the active frozen plan will be sent (support/ops tool)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignPlanPreviewInput" }
      responses:
        "200":
          description: Resolved route, frozen template, and rendered message for the contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignPlanPreviewResult" }
        "404":
          description: No active plan, contact not found, or contact not allocated under the active plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /organizations/{organizationId}/campaigns/{campaignId}/plan/recipients:
    post:
      operationId: searchCampaignPlanRecipients
      tags: [campaign-engine]
      summary: Browse/search every recipient under the active frozen plan with their resolved message (support/ops tool)
      description: >-
        POST (not GET) intentionally: this campaign resource's route already
        has path params, and orval's zod codegen collides when a GET
        operation on a path-param resource also gets query params (produces
        a duplicate `<OperationId>Params` export). Body params sidestep it.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignPlanRecipientsSearchInput" }
      responses:
        "200":
          description: Page of resolved recipients under the active frozen plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignPlanRecipientsPage" }
        "404":
          description: Campaign has no active frozen plan yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /organizations/{organizationId}/campaigns/{campaignId}/messages/search:
    post:
      operationId: searchCampaignMessages
      tags: [campaign-engine]
      summary: Browse per-recipient send status, provider errors, and retry history for a campaign (support/ops observability)
      description: >-
        POST (not GET) intentionally: this campaign resource's route already
        has path params, and orval's zod codegen collides when a GET
        operation on a path-param resource also gets query params (produces
        a duplicate `<OperationId>Params` export). Body params sidestep it.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignMessagesSearchInput" }
      responses:
        "200":
          description: Page of send jobs with their provider delivery status and error history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignMessagesPage" }

  /organizations/{organizationId}/campaigns/{campaignId}/messages/export.csv:
    get:
      operationId: exportCampaignMessages
      tags: [campaign-engine]
      summary: Download the campaign's full delivery log (every send job, not just one page), as CSV
      description: >-
        Streams every send job for this campaign with its provider delivery
        status and error history, keyset-paginated server-side so it stays
        safe against very large campaigns -- the same scale-safe pattern as
        the rejected-rows import download.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      responses:
        "200":
          description: CSV file of the campaign's full delivery log
          content:
            text/csv:
              schema: { type: string, format: binary }
        "404":
          description: Campaign not found under this org

  /organizations/{organizationId}/campaigns/{campaignId}/monitoring:
    get:
      operationId: getCampaignMonitoring
      tags: [campaign-engine]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      responses:
        "200":
          description: Database-backed campaign and route metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignMonitoring" }

  /organizations/{organizationId}/campaigns/{campaignId}/readiness:
    get:
      operationId: getCampaignReadiness
      tags: [campaign-engine]
      summary: Proactively check whether a campaign passes every Plan/Execute readiness rule
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      responses:
        "200":
          description: The same readiness checks Plan/Execute enforce, evaluated on demand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignReadiness" }

  /organizations/{organizationId}/whatsapp/integration:
    get:
      operationId: getWhatsAppIntegration
      tags: [whatsapp-integration]
      summary: Get WhatsApp integration settings (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: Integration settings without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppIntegration" }
    patch:
      operationId: updateWhatsAppIntegration
      tags: [whatsapp-integration]
      summary: Update WhatsApp integration settings (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatsAppIntegrationUpdate" }
      responses:
        "200":
          description: Updated integration settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppIntegration" }

  /organizations/{organizationId}/whatsapp/health:
    get:
      operationId: getWhatsAppHealth
      tags: [whatsapp-integration]
      summary: Validate WhatsApp provider health (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: Provider health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppHealth" }

  /organizations/{organizationId}/whatsapp/sync:
    post:
      operationId: syncWhatsAppResources
      tags: [whatsapp-integration]
      summary: Synchronize configured WABA resources (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: Synchronization result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppSyncResult" }

  /organizations/{organizationId}/whatsapp/wabas:
    get:
      operationId: listWhatsAppWabas
      tags: [whatsapp-integration]
      summary: List synchronized WABAs (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: Synchronized WABAs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WhatsAppWaba" }

  /organizations/{organizationId}/whatsapp/manual/connect:
    post:
      operationId: connectManualWhatsAppNumber
      tags: [whatsapp-manual]
      summary: Validate a workspace-supplied Meta token and discover a phone number (owner/admin only)
      description: |
        Proves the token is live, proves it can read the given WABA, finds the
        phone number inside it and persists the credential (encrypted), WABA
        and phone in one transaction. The discovered number is NOT sendable:
        it is stored with status "Pending" and setupState "discovered".
        When wabaId is omitted the response has outcome "waba_id_required"
        and nothing is persisted. The access token is never returned.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualWhatsAppConnectInput" }
      responses:
        "200":
          description: Connection outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualWhatsAppConnectResult" }
        "400":
          description: Invalid phone number, rejected token or WABA the token cannot read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualWhatsAppConnectError" }
        "404":
          description: The phone number is not in that WABA
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualWhatsAppConnectError" }
        "409":
          description: The number or WABA is already connected to another workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualWhatsAppConnectError" }
        "503":
          description: Credential encryption is not configured on this server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualWhatsAppConnectError" }

  /organizations/{organizationId}/whatsapp/credentials:
    get:
      operationId: listWhatsAppCredentials
      tags: [whatsapp-manual]
      summary: List workspace WhatsApp credentials without secrets (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: Credentials (metadata only, never the token or ciphertext)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WhatsAppCredential" }

  /organizations/{organizationId}/whatsapp/credentials/{credentialId}:
    delete:
      operationId: revokeWhatsAppCredential
      tags: [whatsapp-manual]
      summary: Revoke a workspace WhatsApp credential (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - name: credentialId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The revoked credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppCredential" }
        "404":
          description: Credential not found in this workspace

  /organizations/{organizationId}/whatsapp/numbers/{phoneNumberId}/verification/request:
    post:
      operationId: requestWhatsAppPhoneVerificationCode
      tags: [whatsapp-manual]
      summary: Ask Meta to send an ownership verification code by SMS or voice (owner/admin only)
      description: |
        Uses the workspace credential already associated with the number;
        the browser never sends a token. The code itself is sent by Meta to
        the phone and is never seen or stored by Wabista.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/PhoneNumberIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatsAppPhoneVerificationRequestInput" }
      responses:
        "200":
          description: Code requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupResult" }
        "400":
          description: Invalid input or Meta refused the request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupError" }
        "404":
          description: Phone number not found in this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupError" }
        "409":
          description: Number not eligible, credential inactive or step already completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupError" }

  /organizations/{organizationId}/whatsapp/numbers/{phoneNumberId}/verification/verify:
    post:
      operationId: verifyWhatsAppPhoneCode
      tags: [whatsapp-manual]
      summary: Submit the verification code Meta sent to the phone (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/PhoneNumberIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatsAppPhoneVerifyCodeInput" }
      responses:
        "200":
          description: Ownership verified; registration is next
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupResult" }
        "400":
          description: Code not accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupError" }
        "404":
          description: Phone number not found in this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupError" }
        "409":
          description: Number not eligible, credential inactive or step already completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupError" }

  /organizations/{organizationId}/whatsapp/numbers/{phoneNumberId}/register:
    post:
      operationId: registerWhatsAppPhone
      tags: [whatsapp-manual]
      summary: Register the verified number for Cloud API with a 6-digit two-step PIN (owner/admin only)
      description: |
        Successful registration does NOT make the number campaign-sendable:
        status stays Pending and setupState becomes
        registered_transport_pending until Wabista sending activation.
        The PIN is used for this one request and never stored.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/PhoneNumberIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatsAppPhoneRegisterInput" }
      responses:
        "200":
          description: Registered with Meta; sending activation pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupResult" }
        "400":
          description: Invalid PIN or Meta refused registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupError" }
        "404":
          description: Phone number not found in this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupError" }
        "409":
          description: Ownership not verified yet, number not eligible or credential inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupError" }

  /organizations/{organizationId}/whatsapp/numbers/{phoneNumberId}/activate-sending:
    post:
      operationId: activateWhatsAppPhoneSending
      tags: [whatsapp-manual]
      summary: Activate campaign sending for a registered manual number using its workspace credential (owner/admin only)
      description: |
        The only step that makes a workspace-credential number sendable. The
        server validates the number is registered, the credential is active
        and owns the number's WABA, and that Meta still grants access to the
        exact phone (a read, no message is sent). On success status becomes
        Connected, setupState becomes active and the credential is bound for
        campaign transport. No secret input; nothing secret is returned.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/PhoneNumberIdParam"
      responses:
        "200":
          description: Sending activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupResult" }
        "400":
          description: Meta refused access to the number
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupError" }
        "404":
          description: Phone number not found in this workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupError" }
        "409":
          description: Not registered yet, credential inactive or WABA mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppPhoneSetupError" }

  /organizations/{organizationId}/whatsapp/templates/sync:
    post:
      operationId: syncWhatsAppTemplates
      tags: [whatsapp-manual]
      summary: Synchronise Meta message templates for every eligible WhatsApp Business Account (owner/admin only)
      description: |
        Each WABA with a workspace credential is synchronised with that
        credential through the direct Meta client; a WABA configured on the
        legacy shared connector keeps the legacy path. WABAs are handled
        independently and reported one by one. No body, no secrets.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: Per-WABA synchronisation results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppTemplateSyncResult" }

  /organizations/{organizationId}/whatsapp/compatibility:
    post:
      operationId: getWhatsAppCompatibility
      tags: [whatsapp-manual]
      summary: "Sender-template compatibility for selected numbers and templates (bounded; no provider calls)"
      description: "One shared, tenant-scoped eligibility decision per pair. Omit numberIds to derive the numbers of the templates' business accounts, or templateIds to derive the templates of the numbers' business accounts (each bounded). Reads only: ids outside the workspace are reported as not_found, never revealed."
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatsAppCompatibilityInput" }
      responses:
        "200":
          description: Compatibility matrix for the selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppCompatibility" }
        "400":
          description: Too many ids or an empty selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /organizations/{organizationId}/campaigns/{campaignId}/compatibility:
    get:
      operationId: getCampaignCompatibility
      tags: [campaign-engine]
      summary: "Compatibility of a campaign's current selected templates and routed numbers"
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/CampaignIdParam"
      responses:
        "200":
          description: Compatibility matrix for the campaign's routes and selections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatsAppCompatibility" }
        "404":
          description: Campaign not found in this organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /organizations/{organizationId}/template-authoring/wabas:
    get:
      operationId: listTemplateAuthoringWabas
      tags: [template-drafts]
      summary: Business accounts a draft can be submitted through (workspace credential required)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      responses:
        "200":
          description: Named business accounts with authoring eligibility
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TemplateAuthoringWaba" }

  /organizations/{organizationId}/template-drafts:
    get:
      operationId: listTemplateDrafts
      tags: [template-drafts]
      summary: List template drafts (keyset paginated, newest first)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: One page of drafts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftPage" }
    post:
      operationId: createTemplateDraft
      tags: [template-drafts]
      summary: Create a draft (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateDraftInput" }
      responses:
        "201":
          description: Created draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraft" }
        "400":
          description: Invalid draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }
        "409":
          description: A draft with this name and language already exists for the business account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }

  /organizations/{organizationId}/template-drafts/{draftId}:
    get:
      operationId: getTemplateDraft
      tags: [template-drafts]
      summary: Get a draft with its latest submission attempt
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/TemplateDraftIdParam"
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraft" }
        "404":
          description: Not found in this organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }
    patch:
      operationId: updateTemplateDraft
      tags: [template-drafts]
      summary: Edit a draft with optimistic concurrency (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/TemplateDraftIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateDraftUpdate" }
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraft" }
        "400":
          description: Invalid draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }
        "404":
          description: Not found in this organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }
        "409":
          description: Stale revision (code stale_revision), draft not editable in its state (code not_editable) or name conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }
    delete:
      operationId: deleteTemplateDraft
      tags: [template-drafts]
      summary: Delete a draft that is not being submitted (owner/admin only)
      description: "Refused while a submission is in progress or unresolved. Submission attempts are detached and kept as evidence, not erased. Pass expectedRevision so a stale client cannot delete a draft it has not seen."
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/TemplateDraftIdParam"
        - name: expectedRevision
          in: query
          required: false
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found in this organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }
        "409":
          description: The draft has an attempt in progress or awaiting reconciliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }

  /organizations/{organizationId}/template-drafts/{draftId}/submit:
    post:
      operationId: submitTemplateDraft
      tags: [template-drafts]
      summary: Submit the draft to Meta through the business account's workspace credential (owner/admin only)
      description: |
        Claims one attempt per draft in the database before any provider
        request, performs the creation outside any transaction, and records
        the outcome. A repeated call while an attempt is active returns that
        attempt (code attempt_in_progress) and never sends a second request.
        Submitted means Meta accepted the template for review; it is not
        approval and not readiness to send.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/TemplateDraftIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateDraftSubmitInput" }
      responses:
        "200":
          description: Draft with the attempt outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraft" }
        "400":
          description: The draft is incomplete or invalid for submission (field errors)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }
        "404":
          description: Not found in this organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }
        "409":
          description: Stale revision, attempt in progress, reconciliation required, credential or business account not usable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }
        "502":
          description: Meta could not be reached; the attempt outcome is uncertain and must be reconciled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }

  /organizations/{organizationId}/template-drafts/{draftId}/reconcile:
    post:
      operationId: reconcileTemplateDraft
      tags: [template-drafts]
      summary: Resolve an uncertain submission by reading the business account's templates (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/TemplateDraftIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateDraftReconcileInput" }
      responses:
        "200":
          description: Draft after reconciliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraft" }
        "404":
          description: Not found in this organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }
        "409":
          description: Nothing to reconcile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }

  /organizations/{organizationId}/template-drafts/{draftId}/refresh-status:
    post:
      operationId: refreshTemplateDraftStatus
      tags: [template-drafts]
      description: "Runs the hardened per-business-account template synchronisation (generation-ordered, credential revalidated under locks) and returns the draft with the APPLIED status. 409 sync_superseded when a newer sync finished first; the draft then already shows that newer result."
      summary: Read the submitted template's current provider status (owner/admin only)
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - $ref: "#/components/parameters/TemplateDraftIdParam"
      responses:
        "200":
          description: Draft with refreshed provider status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraft" }
        "404":
          description: Not found in this organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }
        "409":
          description: The draft has not been submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }

  /organizations/{organizationId}/template-media:
    post:
      operationId: uploadTemplateMedia
      tags: [template-drafts]
      summary: Upload a header media example to Meta through the business account's credential (owner/admin only)
      description: |
        Raw file body (application/octet-stream) of a bounded size. The server
        resolves the business account's credential and the configured Meta app,
        runs the Resumable Upload API, and stores only a reference to the
        resulting provider handle. The handle never reaches the browser.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdParam"
        - name: wabaId
          in: query
          required: true
          schema: { type: integer }
        - name: fileName
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: contentType
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored media example
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateMediaUpload" }
        "400":
          description: Unsupported type or size
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }
        "409":
          description: Business account or credential not usable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }
        "502":
          description: Meta rejected or did not complete the upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }
        "503":
          description: Media authoring is not configured on this server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDraftError" }

  /webhooks/whatsapp:
    get:
      operationId: verifyWhatsAppWebhook
      tags: [whatsapp-webhook]
      summary: Verify a Meta WhatsApp webhook subscription
      parameters:
        - name: hub.mode
          in: query
          schema: { type: string }
        - name: hub.verify_token
          in: query
          schema: { type: string }
        - name: hub.challenge
          in: query
          schema: { type: string }
      responses:
        "200": { description: Verification challenge }
        "503": { description: Verification is not configured }
    post:
      operationId: receiveWhatsAppWebhook
      tags: [whatsapp-webhook]
      summary: Receive signed Meta WhatsApp status events
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean }
        "503": { description: Signature validation is not configured }

components:
  parameters:
    OrganizationIdParam:
      name: organizationId
      in: path
      required: true
      schema:
        type: integer
    MemberIdParam:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
    ContactIdParam:
      name: contactId
      in: path
      required: true
      schema:
        type: integer
    TemplateDraftIdParam:
      name: draftId
      in: path
      required: true
      schema: { type: integer }
    PhoneNumberIdParam:
      name: phoneNumberId
      in: path
      required: true
      schema:
        type: integer
    TemplateIdParam:
      name: templateId
      in: path
      required: true
      schema:
        type: integer
    CampaignIdParam:
      name: campaignId
      in: path
      required: true
      schema:
        type: integer
    RouteIdParam:
      name: routeId
      in: path
      required: true
      schema:
        type: integer
    InvitationIdParam:
      name: invitationId
      in: path
      required: true
      schema:
        type: integer
    SuppressionIdParam:
      name: suppressionId
      in: path
      required: true
      schema:
        type: integer
    MediaAssetIdParam:
      name: mediaAssetId
      in: path
      required: true
      schema:
        type: integer

    PresetIdParam:
      name: presetId
      in: path
      required: true
      schema:
        type: integer

    ImportSessionIdParam:
      name: importSessionId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    WhatsAppProviderMode:
      type: string
      enum: [mock, real]

    ManualWhatsAppConnectInput:
      type: object
      required: [phoneNumber, accessToken]
      properties:
        phoneNumber:
          type: string
          minLength: 1
          description: The number to connect, with country code (any formatting).
        accessToken:
          type: string
          minLength: 1
          writeOnly: true
          description: Meta system-user or permanent access token. Stored encrypted; never returned.
        wabaId:
          type: ["string", "null"]
          description: WhatsApp Business Account ID. Required when the token cannot enumerate the number on its own.

    ManualWhatsAppConnectResult:
      type: object
      required: [outcome, message]
      properties:
        outcome: { type: string, enum: [connected, waba_id_required] }
        message: { type: string }
        phoneNumber: { $ref: "#/components/schemas/PhoneNumber" }
        waba: { $ref: "#/components/schemas/WhatsAppWaba" }
        credential: { $ref: "#/components/schemas/WhatsAppCredential" }

    ManualWhatsAppConnectError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [encryption_unavailable, invalid_phone, token_rejected, waba_denied, phone_not_found, number_claimed, waba_claimed, provider_unavailable]
        details: { type: object, additionalProperties: true }

    WhatsAppPhoneVerificationRequestInput:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [SMS, VOICE]
          description: How Meta delivers the verification code.
        locale:
          type: string
          description: BCP-style locale such as en_US. Defaults to en_US.

    WhatsAppPhoneVerifyCodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          pattern: "^[0-9]+$"
          writeOnly: true
          description: The numeric code Meta sent. Kept as a string so leading zeroes survive; never stored.

    WhatsAppPhoneRegisterInput:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"
          writeOnly: true
          description: The 6-digit two-step verification PIN the person chooses. Used once for registration; never stored.

    WhatsAppPhoneSetupResult:
      type: object
      required: [setupState, message, phoneNumber]
      properties:
        setupState:
          type: string
          enum: [unknown, discovered, verification_code_sent, registration_required, registered_transport_pending, active, action_required]
        message: { type: string }
        phoneNumber: { $ref: "#/components/schemas/PhoneNumber" }

    WhatsAppPhoneSetupError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [phone_not_found, phone_not_eligible, credential_inactive, encryption_unavailable, invalid_input, state_conflict, code_rejected, registration_rejected, activation_rejected, provider_unavailable]
        details: { type: object, additionalProperties: true }

    WhatsAppTemplateSyncResult:
      type: object
      required: [syncedAt, wabas]
      properties:
        syncedAt: { type: string, format: date-time }
        wabas:
          type: array
          items: { $ref: "#/components/schemas/WhatsAppWabaTemplateSyncResult" }

    WhatsAppWabaTemplateSyncResult:
      type: object
      required: [wabaId, wabaExternalId, wabaDisplayName, source, status, templatesSeen, templatesUpserted, templatesMarkedRemoved]
      properties:
        wabaId: { type: integer }
        wabaExternalId: { type: string }
        wabaDisplayName: { type: string }
        source: { type: string, enum: [workspace_credential, legacy_connector] }
        status:
          type: string
          enum: [synced, failed, superseded]
          description: superseded means a newer sync of this account already applied and this snapshot was discarded without writing.
        generation: { type: integer }
        templatesSeen: { type: integer }
        templatesUpserted: { type: integer }
        templatesMarkedRemoved: { type: integer }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [credential_inactive, waba_not_found, provider_unavailable, provider_rejected, legacy_sync_failed] }
            message: { type: string }
            providerCode: { type: string }
            retryable: { type: boolean }

    EligibilityReasonCode:
      type: string
      enum: [eligible, eligible_local_mock, not_found, phone_sample, phone_not_connected, phone_no_provider_identity, phone_no_waba, credential_inactive, credential_unbound, legacy_waba_not_claimed, template_sample, template_not_provider_backed, template_not_approved, template_removed, evidence_missing, evidence_not_sendable, waba_mismatch]

    CompatibilityEvidence:
      type: object
      required: [source, verifiedAt]
      properties:
        source: { type: string, enum: [workspace_credential, legacy_connector, backfill, local_mock] }
        verifiedAt: { type: ["string", "null"], format: date-time }

    CompatibilityNumber:
      type: object
      required: [phoneNumberId, phone, displayName, wabaId, wabaExternalId, transport, eligibleTemplateIds, code]
      properties:
        phoneNumberId: { type: integer }
        phone: { type: string }
        displayName: { type: string }
        wabaId: { type: ["integer", "null"] }
        wabaExternalId: { type: ["string", "null"] }
        transport: { type: ["string", "null"], enum: [workspace_credential, legacy_connector, local_mock, null] }
        eligibleTemplateIds:
          type: array
          items: { type: integer }
        code: { $ref: "#/components/schemas/EligibilityReasonCode" }

    CompatibilityTemplate:
      type: object
      required: [templateId, name, language, wabaId, wabaExternalId, eligiblePhoneNumberIds, evidence, code]
      properties:
        templateId: { type: integer }
        name: { type: string }
        language: { type: string }
        wabaId: { type: ["integer", "null"] }
        wabaExternalId: { type: ["string", "null"] }
        eligiblePhoneNumberIds:
          type: array
          items: { type: integer }
        evidence:
          oneOf:
            - $ref: "#/components/schemas/CompatibilityEvidence"
            - type: "null"
        code: { $ref: "#/components/schemas/EligibilityReasonCode" }

    CompatibilityPair:
      type: object
      required: [phoneNumberId, templateId, code, message]
      properties:
        phoneNumberId: { type: integer }
        templateId: { type: integer }
        code: { $ref: "#/components/schemas/EligibilityReasonCode" }
        message: { type: string }

    WhatsAppCompatibilityInput:
      type: object
      properties:
        numberIds:
          type: array
          maxItems: 50
          items: { type: integer }
        templateIds:
          type: array
          maxItems: 50
          items: { type: integer }

    WhatsAppCompatibility:
      type: object
      required: [evaluatedAt, numbers, templates, incompatiblePairs, numbersWithoutTemplate, templatesWithoutNumber]
      properties:
        evaluatedAt: { type: string, format: date-time }
        numbers:
          type: array
          items: { $ref: "#/components/schemas/CompatibilityNumber" }
        templates:
          type: array
          items: { $ref: "#/components/schemas/CompatibilityTemplate" }
        incompatiblePairs:
          type: array
          description: "Only the pairs that cannot send, with a stable reason; eligible pairs are the lists above."
          items: { $ref: "#/components/schemas/CompatibilityPair" }
        numbersWithoutTemplate:
          type: array
          items: { type: integer }
        templatesWithoutNumber:
          type: array
          items: { type: integer }

    TemplateDraftHeader:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [none, text, image, video, document] }
        text: { type: string }
        example: { type: string }
        mediaUploadId: { type: ["integer", "null"] }

    TemplateDraftButton:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [quick_reply, url, phone] }
        text: { type: string }
        url: { type: string }
        example: { type: string }
        phoneNumber: { type: string }

    TemplateDraftContent:
      type: object
      required: [header, body, footer, buttons]
      properties:
        header: { $ref: "#/components/schemas/TemplateDraftHeader" }
        body:
          type: object
          required: [text, examples]
          properties:
            text: { type: string }
            examples:
              type: array
              items: { type: string }
        footer:
          type: ["object", "null"]
          required: [text]
          properties:
            text: { type: string }
        buttons:
          type: array
          items: { $ref: "#/components/schemas/TemplateDraftButton" }

    TemplateDraftFieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    TemplateSubmissionAttempt:
      type: object
      required: [id, draftRevision, state, startedAt]
      properties:
        id: { type: integer }
        draftRevision: { type: integer }
        state: { type: string, enum: [requested, succeeded, failed, uncertain] }
        providerTemplateId: { type: ["string", "null"] }
        providerStatus: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        errorCode: { type: ["string", "null"] }
        reconcileNote: { type: ["string", "null"] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }

    TemplateDraft:
      type: object
      required: [id, wabaId, wabaDisplayName, name, language, category, content, revision, state, providerTemplateId, providerStatus, providerStatusCheckedAt, templateId, lastError, latestAttempt, createdAt, updatedAt]
      properties:
        id: { type: integer }
        wabaId: { type: ["integer", "null"] }
        wabaDisplayName: { type: ["string", "null"] }
        wabaExternalId: { type: ["string", "null"] }
        name: { type: string }
        language: { type: string }
        category: { type: string, enum: [MARKETING, UTILITY] }
        content: { $ref: "#/components/schemas/TemplateDraftContent" }
        revision:
          type: integer
          description: "Content revision. Changes only on PATCH (name, language, category, business account, content). Submit, reconcile and refresh-status change state and provider fields but never the revision; they are fenced by state and attempt identity instead."
        state: { type: string, enum: [draft, submitting, submitted, failed, reconcile_required] }
        providerTemplateId: { type: ["string", "null"] }
        providerStatus:
          type: ["string", "null"]
          description: Raw status Meta last reported for the submitted template. Never set locally.
        providerStatusCheckedAt: { type: ["string", "null"], format: date-time }
        templateId: { type: ["integer", "null"] }
        lastError: { type: ["string", "null"] }
        latestAttempt:
          oneOf:
            - $ref: "#/components/schemas/TemplateSubmissionAttempt"
            - type: "null"
        validation:
          type: array
          description: Field-level problems that would block submission, computed server-side.
          items: { $ref: "#/components/schemas/TemplateDraftFieldError" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TemplateDraftPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TemplateDraft" }
        nextCursor: { type: ["integer", "null"] }

    TemplateDraftInput:
      type: object
      required: [name, language, category, content]
      properties:
        wabaId: { type: ["integer", "null"] }
        name: { type: string, minLength: 1, maxLength: 512 }
        language: { type: string, minLength: 2, maxLength: 10 }
        category: { type: string, enum: [MARKETING, UTILITY] }
        content: { $ref: "#/components/schemas/TemplateDraftContent" }

    TemplateDraftUpdate:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer }
        wabaId: { type: ["integer", "null"] }
        name: { type: string, minLength: 1, maxLength: 512 }
        language: { type: string, minLength: 2, maxLength: 10 }
        category: { type: string, enum: [MARKETING, UTILITY] }
        content: { $ref: "#/components/schemas/TemplateDraftContent" }

    TemplateDraftSubmitInput:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer }

    TemplateDraftReconcileInput:
      type: object
      required: [attemptId]
      description: "Names the attempt the client is looking at. Reconciliation is fenced by attempt identity and state, not by content revision: a stale client cannot settle a newer attempt. There is no discard option; an unknown outcome stays unresolved until Meta confirms it."
      properties:
        attemptId: { type: integer }

    TemplateDraftError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [invalid_draft, not_found, stale_revision, not_editable, name_conflict, attempt_in_progress, reconcile_required, waba_not_eligible, credential_inactive, provider_rejected, provider_unavailable, not_submitted, sync_superseded, stale_attempt, media_not_configured, media_invalid, media_unavailable]
        fields:
          type: array
          items: { $ref: "#/components/schemas/TemplateDraftFieldError" }
        attempt:
          oneOf:
            - $ref: "#/components/schemas/TemplateSubmissionAttempt"
            - type: "null"

    TemplateAuthoringWaba:
      type: object
      required: [id, displayName, authoringSupported]
      properties:
        id: { type: integer }
        displayName: { type: string }
        externalId: { type: string }
        authoringSupported: { type: boolean }
        reason: { type: ["string", "null"] }
        mediaSupported: { type: boolean }

    TemplateMediaUpload:
      type: object
      required: [id, wabaId, fileName, contentType, byteLength, kind, state, expiresAt, createdAt]
      properties:
        id: { type: integer }
        wabaId: { type: integer }
        fileName: { type: string }
        contentType: { type: string }
        byteLength: { type: integer }
        kind: { type: string, enum: [image, video, document] }
        state: { type: string, enum: [ready, failed] }
        error: { type: ["string", "null"] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    WhatsAppCredential:
      type: object
      required: [id, provider, kind, status, fingerprint, providerIdentity, lastValidatedAt, lastError, createdAt]
      properties:
        id: { type: integer }
        provider: { type: string }
        kind: { type: string }
        status: { type: string, enum: [active, invalid, revoked] }
        fingerprint:
          type: string
          description: Short non-secret hash prefix so a person can tell credentials apart.
        providerIdentity: { type: ["string", "null"] }
        lastValidatedAt: { type: ["string", "null"], format: date-time }
        lastError: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    WhatsAppIntegration:
      type: object
      required: [organizationId, mode, status, health, webhookVerificationConfigured, webhookSignatureConfigured, createdAt, updatedAt]
      properties:
        organizationId: { type: integer }
        mode: { $ref: "#/components/schemas/WhatsAppProviderMode" }
        connectorAccountId: { type: ["string", "null"], description: Non-secret connector identity, available only after real-mode verification. }
        configuredWabaExternalId: { type: ["string", "null"] }
        status: { type: string, enum: [unconfigured, configured, syncing, healthy, error] }
        health: { type: string, enum: [unknown, healthy, unhealthy] }
        lastHealthAt: { type: ["string", "null"], format: date-time }
        lastSyncAt: { type: ["string", "null"], format: date-time }
        lastErrorAt: { type: ["string", "null"], format: date-time }
        lastError: { type: ["string", "null"] }
        webhookVerificationConfigured: { type: boolean }
        webhookSignatureConfigured: { type: boolean }
        realWorkspaceLimit: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WhatsAppIntegrationUpdate:
      type: object
      properties:
        mode: { $ref: "#/components/schemas/WhatsAppProviderMode" }
        configuredWabaExternalId: { type: ["string", "null"], maxLength: 128 }

    WhatsAppHealth:
      type: object
      required: [mode, status, checkedAt]
      properties:
        mode: { $ref: "#/components/schemas/WhatsAppProviderMode" }
        status: { type: string, enum: [healthy, unhealthy, not_configured] }
        checkedAt: { type: string, format: date-time }
        error: { type: ["string", "null"] }

    WhatsAppSyncResult:
      type: object
      required: [wabas, phoneNumbers, templates, syncedAt]
      properties:
        wabas: { type: integer }
        phoneNumbers: { type: integer }
        templates: { type: integer }
        syncedAt: { type: string, format: date-time }

    Suppression:
      type: object
      required: [id, organizationId, normalizedPhone, reason, createdAt, updatedAt]
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        normalizedPhone: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SuppressionInput:
      type: object
      required: [phone]
      properties:
        phone: { type: string, minLength: 1, maxLength: 32 }
        reason: { type: string, maxLength: 300 }

    WhatsAppWaba:
      type: object
      required: [id, externalId, displayName, provider, createdAt, updatedAt]
      properties:
        id: { type: integer }
        externalId: { type: string }
        displayName: { type: string }
        provider: { type: string }
        providerStatus: { type: ["string", "null"] }
        lastSyncedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HealthStatus:
      type: object
      properties:
        status:
          type: string
        campaignRuntime:
          type: object
          description: Liveness of the background campaign send/housekeeping loop. Informational only -- does not affect the top-level `status` or HTTP status code, so a stale worker is surfaced for monitoring without failing container health/readiness checks.
          properties:
            status:
              type: string
              enum: [ok, stale, not_started]
            ageMs:
              type: integer
              nullable: true
          required:
            - status
            - ageMs
        initialization:
          type: object
          description: "Startup initialization state (informational on /healthz; authoritative on /readyz). Campaign work is consumed only once this is ready."
          properties:
            phase: { type: string, enum: [pending, initializing, ready, failed, stopped] }
            error: { type: ["string", "null"] }
          required: [phase, error]
      required:
        - status

    ReadinessStatus:
      type: object
      required: [status, database, initialization]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        database: { type: string }
        initialization:
          type: object
          required: [phase, error, completedAt]
          properties:
            phase: { type: string, enum: [pending, initializing, ready, failed, stopped] }
            error: { type: ["string", "null"] }
            completedAt: { type: ["string", "null"], format: date-time }

    CurrentUser:
      type: object
      required: [id, email, name, isPlatformAdmin, createdAt]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        isPlatformAdmin: { type: boolean }
        createdAt: { type: string, format: date-time }

    OrganizationRole:
      type: string
      enum: [owner, admin, manager, agent]

    Organization:
      type: object
      required: [id, name, slug, role, isActive, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        role:
          $ref: "#/components/schemas/OrganizationRole"
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrganizationUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }

    Member:
      type: object
      required: [id, userId, name, email, role, isSelf, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        name: { type: string }
        email: { type: string }
        role:
          $ref: "#/components/schemas/OrganizationRole"
        isSelf: { type: boolean }
        createdAt: { type: string, format: date-time }

    MemberInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/OrganizationRole"

    MemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/OrganizationRole"

    Invitation:
      type: object
      required: [id, email, role, status, createdAt, token]
      properties:
        id: { type: integer }
        email: { type: string }
        role:
          $ref: "#/components/schemas/OrganizationRole"
        status: { type: string, enum: [Pending, Accepted, Revoked] }
        invitedByName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        token:
          type: string
          description: Opaque token used to build a shareable `/invite/:token` link for this invitation.

    InvitationPreview:
      type: object
      required: [organizationName, role, email, status]
      properties:
        organizationName: { type: string }
        role:
          $ref: "#/components/schemas/OrganizationRole"
        email: { type: string }
        status: { type: string, enum: [Pending, Accepted, Revoked] }

    # POST /members returns exactly one of these two: `member` when the
    # invited email already has an account (added immediately), or
    # `invitation` when it does not (a Pending invite is created and will be
    # accepted automatically the first time that email signs up -- see
    # attachOrgContext / acceptPendingInvitations).
    InviteMemberResult:
      type: object
      properties:
        member:
          $ref: "#/components/schemas/Member"
        invitation:
          $ref: "#/components/schemas/Invitation"

    Contact:
      type: object
      required: [id, name, phone, tags, status, source, isSample, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        email: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        status: { type: string, enum: [Active, Inactive, Unsubscribed] }
        source: { type: string }
        lastContactedAt: { type: ["string", "null"], format: date-time }
        isSample: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ContactInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        email: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        status: { type: string, enum: [Active, Inactive, Unsubscribed] }
        source: { type: string }

    ContactUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        email: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        status: { type: string, enum: [Active, Inactive, Unsubscribed] }
        source: { type: string }

    PhoneNumber:
      type: object
      required: [id, phone, displayName, wabaExternalId, provider, quality, status, tpsLimit, isSample, createdAt, updatedAt]
      properties:
        id: { type: integer }
        providerPhoneId: { type: ["string", "null"] }
        phone: { type: string }
        displayName: { type: string }
        wabaExternalId: { type: ["string", "null"] }
        provider: { type: string }
        quality: { type: string, enum: [High, Medium, Low] }
        status: { type: string, enum: [Connected, Flagged, Pending] }
        tpsLimit: { type: integer }
        isSample: { type: boolean }
        providerMetadata: { type: object, additionalProperties: true }
        setupState:
          type: string
          description: V2 onboarding progress (unknown, discovered, verification_code_sent, registration_required, registered_transport_pending, active, action_required). Independent of status, which the sending engine reads.
        setupError: { type: ["string", "null"] }
        credentialId: { type: ["integer", "null"] }
        sendingCredentialId:
          type: ["integer", "null"]
          description: Workspace credential campaign sending authenticates with. Null means the legacy shared connector.
        wabaDisplayName: { type: ["string", "null"] }
        lastSyncedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PhoneNumberInput:
      type: object
      required: [phone, displayName]
      properties:
        phone: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
        wabaExternalId: { type: ["string", "null"] }
        provider: { type: string }
        quality: { type: string, enum: [High, Medium, Low] }
        status: { type: string, enum: [Connected, Flagged, Pending] }
        tpsLimit: { type: integer, minimum: 1 }

    PhoneNumberUpdate:
      type: object
      properties:
        phone: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
        wabaExternalId: { type: ["string", "null"] }
        provider: { type: string }
        quality: { type: string, enum: [High, Medium, Low] }
        status: { type: string, enum: [Connected, Flagged, Pending] }
        tpsLimit: { type: integer, minimum: 1 }

    Template:
      type: object
      required: [id, name, category, language, status, body, isSample, createdAt, updatedAt]
      properties:
        id: { type: integer }
        providerTemplateId: { type: ["string", "null"] }
        name: { type: string }
        category:
          type: string
          description: "Provider category, capitalised (Marketing, Utility, Authentication, or another value Meta reports)."
        language: { type: string }
        status:
          type: string
          description: >-
            Provider status normalised for display: Approved, Pending, Rejected,
            Paused, Disabled, In appeal, Pending deletion, Deleted, Limit exceeded,
            Removed (no longer returned by Meta), Unknown, or another value Meta
            reports. Only Approved is sendable. Read-only for synchronised templates.
        body: { type: string }
        isSample: { type: boolean }
        wabaId: { type: ["integer", "null"] }
        wabaExternalId: { type: ["string", "null"] }
        wabaDisplayName: { type: ["string", "null"] }
        source:
          type: ["string", "null"]
          description: "How the row got here: workspace_credential, legacy_connector, or null for a locally created row."
        providerStatus:
          type: ["string", "null"]
          description: The raw status string Meta last reported.
        providerMissing:
          type: boolean
          description: True when a previously synchronised template is no longer returned by Meta.
        lastSyncedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        components:
          type: array
          description: >-
            Raw Meta template components (HEADER/BODY/BUTTONS descriptors).
            Used client-side to work out which {{n}} variables a template
            needs mapped before a campaign can go Ready.
          items: { type: object, additionalProperties: true }

    TemplateInput:
      type: object
      description: >-
        Creates a LOCAL template (source "local", status Pending). Approval
        status always comes from Meta through synchronisation and can never
        be set by an API caller.
      required: [name, body]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, enum: [Marketing, Utility, Authentication] }
        language: { type: string }
        body: { type: string, minLength: 1 }

    TemplateUpdate:
      type: object
      description: >-
        Edits a LOCAL template only. A synchronised (provider-backed) template
        is managed by Meta and answers 409; status is never editable.
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, enum: [Marketing, Utility, Authentication] }
        language: { type: string }
        body: { type: string, minLength: 1 }

    TemplateMutationError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string, enum: [provider_backed, referenced] }
        references:
          type: object
          description: Present with code referenced; how many rows of each kind still point at the template.
          properties:
            selections: { type: integer }
            mappings: { type: integer }
            routes: { type: integer }
            jobs: { type: integer }
            allocations: { type: integer }

    Campaign:
      type: object
      required: [id, name, status, audienceSize, sent, delivered, read, failed, schedule, routesCount, isSample, revision, audienceGeneration, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [Draft, Ready, Scheduled, Running, Paused, Completed, Cancelled, Failed] }
        audienceSize: { type: integer }
        creationKey:
          type: ["string", "null"]
          description: "The client key this Draft was created with (see CampaignInput.creationKey); null when created without one."
        revision:
          type: integer
          description: "Increases on every metadata write. Send it back as CampaignUpdate.revision so a stale autosave cannot overwrite newer edits."
        audienceGeneration:
          type: integer
          description: "The audience generation currently active for this campaign (V2-05A; 0 for campaigns imported before it)."
        distributionMode:
          type: ["string", "null"]
          enum: [equal_numbers, equal_templates, null]
          description: "V2-06 distribution mode. null = historical allocator v1 (every campaign created before V2-06); a mode = allocator v2. Set through PUT .../message-setup or .../delivery-setup."
        deliveryMode:
          type: ["string", "null"]
          enum: [fastest_safe, balanced, conservative, advanced, null]
          description: "V2-06B speed mode. null = each sender route's configured rate is frozen (pre-V2-06B behaviour). Set through PUT .../delivery-setup."
        sent: { type: integer }
        delivered: { type: integer }
        read: { type: integer }
        failed: { type: integer }
        schedule: { type: string }
        routesCount: { type: integer }
        isSample: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CampaignsPage:
      type: object
      required: [items, nextCursor, hasMore, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Campaign" }
        nextCursor:
          type: ["integer", "null"]
          description: Pass as `cursor` to fetch the next page; null when this is the last page.
        hasMore: { type: boolean }
        limit: { type: integer }

    CampaignInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        creationKey:
          type: string
          minLength: 8
          maxLength: 128
          description: >-
            Optional client-generated key (unique per organization). Creating again with the same key
            replays the existing Draft (200) instead of creating a second one, so a retried or
            double-clicked "New campaign" never produces duplicate drafts.
        status: { type: string, enum: [Draft, Ready, Scheduled, Running, Paused, Completed, Cancelled, Failed] }
        audienceSize: { type: integer, minimum: 0 }
        sent: { type: integer, minimum: 0 }
        delivered: { type: integer, minimum: 0 }
        read: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        schedule: { type: string }

    CampaignUpdate:
      type: object
      properties:
        revision:
          type: integer
          minimum: 0
          description: >-
            The campaign revision this update was based on. When present and lower than the stored
            revision the update is refused with 409 (code stale_revision) and the current campaign is
            returned, so an autosave response that arrives late cannot overwrite a newer edit.
        name: { type: string, minLength: 1 }
        status: { type: string, enum: [Draft, Ready, Scheduled, Running, Paused, Completed, Cancelled, Failed] }
        audienceSize: { type: integer, minimum: 0 }
        sent: { type: integer, minimum: 0 }
        delivered: { type: integer, minimum: 0 }
        read: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        schedule: { type: string }

    CampaignRoute:
      type: object
      required: [id, campaignId, campaignName, phoneNumberId, phoneNumber, wabaExternalId, templateId, templateName, priority, configuredTps, currentTps, queueDepth, status, isSample, createdAt, updatedAt]
      properties:
        id: { type: integer }
        campaignId: { type: integer }
        campaignName: { type: string }
        phoneNumberId: { type: integer }
        phoneNumber: { type: string }
        wabaId:
          type: ["integer", "null"]
          description: "The phone's business account at the time the route was written (server-derived, re-verified at readiness)."
        wabaExternalId: { type: ["string", "null"] }
        templateId: { type: ["integer", "null"] }
        templateName: { type: ["string", "null"] }
        priority: { type: string, enum: [High, Normal, Low] }
        configuredTps: { type: integer }
        currentTps: { type: integer }
        queueDepth: { type: integer }
        status: { type: string, enum: [Active, Throttled, Error, Paused] }
        isSample: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CampaignRouteInput:
      type: object
      required: [campaignId, phoneNumberId]
      properties:
        campaignId: { type: integer }
        phoneNumberId: { type: integer }
        templateId: { type: ["integer", "null"] }
        priority: { type: string, enum: [High, Normal, Low] }
        configuredTps: { type: integer, minimum: 1 }
        currentTps: { type: integer, minimum: 0 }
        queueDepth: { type: integer, minimum: 0 }
        status: { type: string, enum: [Active, Throttled, Error, Paused] }

    CampaignRouteUpdate:
      type: object
      properties:
        campaignId: { type: integer }
        phoneNumberId: { type: integer }
        templateId: { type: ["integer", "null"] }
        priority: { type: string, enum: [High, Normal, Low] }
        configuredTps: { type: integer, minimum: 1 }
        currentTps: { type: integer, minimum: 0 }
        queueDepth: { type: integer, minimum: 0 }
        status: { type: string, enum: [Active, Throttled, Error, Paused] }

    RocketCampaignNumberInput:
      type: object
      required: [phoneNumberId, configuredTps]
      properties:
        phoneNumberId: { type: integer }
        configuredTps: { type: integer, minimum: 1 }

    RocketCampaignSetupInput:
      type: object
      required: [numbers, templateIds]
      properties:
        numbers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RocketCampaignNumberInput"
        templateIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer }
        priority:
          type: string
          enum: [High, Normal, Low]
          default: Normal

    RocketCampaignSetup:
      type: object
      required: [campaignId, numberCount, templateCount, aggregateTps, routes]
      properties:
        campaignId: { type: integer }
        numberCount: { type: integer }
        templateCount: { type: integer }
        aggregateTps: { type: integer }
        routes:
          type: array
          items:
            $ref: "#/components/schemas/CampaignRoute"

    OverviewStats:
      type: object
      required: [activeCampaigns, connectedNumbers, messagesSent, deliveryRate, tpsOverall]
      properties:
        activeCampaigns: { type: integer }
        connectedNumbers: { type: integer }
        messagesSent: { type: integer }
        deliveryRate: { type: number }
        tpsOverall: { type: integer }

    AnalyticsSummary:
      type: object
      required: [totalSent, deliveryRate, readRate, failureRate, activeRoutes]
      properties:
        totalSent: { type: integer }
        deliveryRate: { type: number }
        readRate: { type: number }
        failureRate: { type: number }
        activeRoutes: { type: integer }

    DeliveryTrendDay:
      type: object
      required: [date, sent, delivered, read, failed]
      properties:
        date: { type: string, description: "YYYY-MM-DD" }
        sent: { type: integer }
        delivered: { type: integer }
        read: { type: integer }
        failed: { type: integer }

    DeliveryTrends:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryTrendDay"

    RouteHealthErrorReason:
      type: object
      required: [reason, count]
      properties:
        reason: { type: string }
        count: { type: integer }

    RouteHealthEntry:
      type: object
      required: [phoneNumberId, displayName, phone, sent, delivered, failed, failureRate, topErrorReasons]
      properties:
        phoneNumberId: { type: integer }
        displayName: { type: string }
        phone: { type: string }
        sent: { type: integer }
        delivered: { type: integer }
        failed: { type: integer }
        failureRate: { type: number }
        topErrorReasons:
          type: array
          items:
            $ref: "#/components/schemas/RouteHealthErrorReason"

    RouteHealth:
      type: object
      required: [routes]
      properties:
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RouteHealthEntry"

    CampaignActionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [plan, schedule, execute, pause, resume, cancel, emergency-kill, reopen, launch]
          description: "`launch` (V2-06C) is the product action: modern preflight must pass; without scheduledAt it freezes the plan and creates its jobs under one lifecycle lock (Running); with a future scheduledAt it freezes the plan and moves to Scheduled (the runtime executes it when due). Retries never freeze a second plan. plan/execute/schedule remain for engineering and operations."
        scheduledAt: { type: string, format: date-time }
        timezone: { type: string, maxLength: 64, description: "IANA time zone the user scheduled in (launch only; display metadata)." }
        reason: { type: string }

    CampaignLifecycle:
      type: object
      required: [id, organizationId, name, status, audienceSize, sent, delivered, read, failed, scheduleLabel, routeCount, createdAt, updatedAt]
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        name: { type: string }
        status:
          type: string
          enum: [Draft, Ready, Scheduled, Running, Paused, Completed, Cancelled, Failed]
        audienceSize: { type: integer }
        sent: { type: integer }
        delivered: { type: integer }
        read: { type: integer }
        failed: { type: integer }
        scheduleLabel: { type: string }
        priority: { type: string, enum: [High, Normal, Low] }
        scheduledAt: { type: ["string", "null"], format: date-time }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        killSwitch: { type: boolean }
        routeCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        launch:
          type: object
          description: "Present on a launch response."
          required: [outcome, planId, queuedNew]
          properties:
            outcome: { type: string, enum: [launched, resumed, already_running, scheduled, already_scheduled] }
            planId: { type: ["integer", "null"] }
            queuedNew: { type: integer, description: "Jobs created by THIS request (0 on an idempotent retry that found them all)." }

    ContactImportSession:
      type: object
      required: [id, organizationId, campaignId, idempotencyKey, fileName, status, columns, bytesProcessed, rowsProcessed, validRows, invalidRows, duplicateRows, suppressedRows, createdAt, updatedAt]
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        campaignId: { type: integer }
        idempotencyKey: { type: string }
        fileName: { type: string }
        status: { type: string }
        phoneColumn: { type: ["string", "null"] }
        defaultCountryCode: { type: ["string", "null"] }
        columns: { type: array, items: { type: string } }
        bytesProcessed: { type: integer }
        rowsProcessed: { type: integer }
        validRows: { type: integer }
        invalidRows: { type: integer }
        duplicateRows: { type: integer }
        suppressedRows: { type: integer }
        error: { type: ["string", "null"] }
        operation: { type: string, enum: [append, replace] }
        audienceGeneration: { type: integer }
        activatedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CampaignContact:
      type: object
      required: [id, organizationId, campaignId, rowNumber, data, status, idempotencyKey, createdAt, updatedAt]
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        campaignId: { type: integer }
        importSessionId: { type: ["integer", "null"] }
        rowNumber: { type: integer }
        rawPhone: { type: ["string", "null"] }
        normalizedPhone: { type: ["string", "null"] }
        data: { type: object, additionalProperties: { type: string } }
        status: { type: string }
        invalidReason: { type: ["string", "null"] }
        partitionKey: { type: ["integer", "null"] }
        routeId: { type: ["integer", "null"] }
        idempotencyKey: { type: string }
        audienceGeneration: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CsvSniffResult:
      type: object
      required: [columns, headerWarnings, sample, sampleRows, truncated, bytesInspected, phoneColumnSuggestion, countryCode]
      properties:
        columns:
          type: array
          items: { type: string }
          description: "Ordered column names exactly as the import will key each row (empty headers become column_N, repeated headers get a _N suffix)."
        headerWarnings:
          type: array
          items: { type: string }
          description: "Human-readable notes about headers that were disambiguated."
        sample:
          type: array
          description: "Up to the server's sample cap of data rows, each aligned to columns (missing cells are empty strings)."
          items:
            type: array
            items: { type: string }
        sampleRows: { type: integer, description: "Number of data rows inside the inspected prefix (capped; see truncated)." }
        truncated: { type: boolean, description: "True when the body was longer than the inspected prefix; counts and the sample describe the prefix only." }
        bytesInspected: { type: integer }
        phoneColumnSuggestion:
          type: ["string", "null"]
          description: "A column name when exactly one header looks like a phone column AND its sampled values look like phone numbers; null when none or several match (the user must choose)."
        countryCode:
          type: object
          required: [decision]
          properties:
            decision:
              type: string
              enum: [not_needed, required, unknown]
              description: "not_needed when every sampled phone value is already international (+ or 00 prefix); required when at least one sampled value is a national number (the user must choose a code; nothing is guessed); unknown when there is no phone column suggestion to sample."
            nationalSampleCount: { type: integer }
            internationalSampleCount: { type: integer }

    CampaignAudience:
      type: object
      required: [campaignId, status, audienceGeneration, editable, reopenRequired, executionHistory, importInProgress, totals, sessions]
      properties:
        campaignId: { type: integer }
        status: { type: string }
        audienceGeneration: { type: integer }
        editable: { type: boolean, description: "The audience can be appended/replaced right now (Draft, no execution history, no import in progress)." }
        reopenRequired: { type: boolean, description: "The campaign is Ready without execution history; reopen makes it editable again." }
        executionHistory: { type: boolean, description: "Jobs or provider work exist; the audience is permanently frozen for this campaign." }
        importInProgress: { type: boolean }
        activeSessionId: { type: ["integer", "null"] }
        totals:
          type: object
          required: [rows, valid, invalid, duplicates, suppressed, sessions]
          description: "Cumulative counts over the completed sessions of the active generation."
          properties:
            rows: { type: integer }
            valid: { type: integer }
            invalid: { type: integer }
            duplicates: { type: integer }
            suppressed: { type: integer }
            sessions: { type: integer }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/ContactImportSession" }

    CampaignConflictError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [stale_revision, status_locked, reopen_required, not_draft, execution_history, import_in_progress, idempotency_mismatch, fenced, invalid_csv, header_invalid, empty_csv, setup_locked]
        campaign: { $ref: "#/components/schemas/Campaign" }
        details: { type: array, items: { type: string } }

    SearchCampaignContactsInput:
      type: object
      properties:
        after:
          type: integer
          description: "Return rows with id greater than this cursor (the previous page's nextCursor; default 0, i.e. from the start)."
        limit:
          type: integer
          description: Page size, 1-2000 (default 500).

    CampaignContactsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CampaignContact" }
        nextCursor:
          type: ["integer", "null"]
          description: "Pass as after to fetch the next page (a contact id); null when this is the last page."

    TemplateMappingRecord:
      type: object
      required: [templateId, component, variable, source, sourceValue]
      properties:
        templateId: { type: integer }
        component: { type: string, enum: [header, body, button] }
        variable: { type: string }
        source: { type: string, enum: [csv, static, media_asset] }
        sourceValue: { type: string }
        mediaAssetId:
          type: ["integer", "null"]
          description: "V2-05B: the campaign media asset a header:media mapping with source media_asset uses (sourceValue carries the same id as text)."
        optional:
          type: boolean
          default: false
          description: When true, a missing/blank CSV value falls back to `fallbackValue` instead of failing the row.
        fallbackValue:
          type: ["string", "null"]
          description: Required non-empty value when `optional` is true; used when the CSV source is missing or blank.

    TemplateMappingInput:
      type: object
      required: [templateIds, mappings]
      properties:
        revision:
          type: integer
          minimum: 0
          description: "Optional Message Studio revision this replacement was based on; a stale one is refused with 409 stale_revision."
        templateIds: { type: array, items: { type: integer } }
        mappings: { type: array, items: { $ref: "#/components/schemas/TemplateMappingRecord" } }

    TemplateMappingReport:
      type: object
      required: [mappings, templates, missing]
      properties:
        mappings: { type: array, items: { $ref: "#/components/schemas/TemplateMappingRecord" } }
        templates:
          type: array
          items:
            type: object
            required: [templateId, headerKind, requiredVariables, compatible]
            properties:
              templateId: { type: integer }
              headerKind: { type: string, enum: [none, text, image, video, document] }
              requiredVariables: { type: array, items: { type: string } }
              compatible: { type: boolean }
        missing: { type: array, items: { type: string } }

    MessageStudioError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [stale_revision, setup_locked, execution_history, import_in_progress, not_found, sender_unusable, template_unusable, invalid_mappings, media_kind_mismatch, media_unavailable, media_storage_unavailable, media_invalid, media_in_use, media_unsupported_transport, media_preparation_failed, delivery_invalid, distribution_invalid, message_setup_incomplete, not_selected, incompatible, credential_inactive, recipient_invalid, recipient_suppressed, mapping_unresolved, provider_rejected, provider_unavailable, delivery_unknown, name_conflict, invalid_preset]
        details: { type: array, items: { type: string } }

    MessageMapping:
      type: object
      required: [templateId, component, variable, source, sourceValue]
      properties:
        templateId: { type: integer }
        component: { type: string, enum: [header, body, button] }
        variable: { type: string, description: "Component-scoped slot: 1 for header/body {{1}}, media for a media header, buttonIndex:n for a URL button variable." }
        source: { type: string, enum: [csv, static, media_asset] }
        sourceValue: { type: string, description: "CSV column name, static text, or (media_asset) the asset id as text." }
        mediaAssetId: { type: ["integer", "null"] }
        optional: { type: boolean, default: false }
        fallbackValue: { type: ["string", "null"] }

    MessageRequirement:
      type: object
      required: [key, component, variable, label]
      properties:
        key: { type: string, description: "Requirement key, e.g. body:1, header:1, header:media, button:0:1." }
        component: { type: string, enum: [header, body, button] }
        variable: { type: string }
        label: { type: string }
        mediaKind: { type: ["string", "null"], enum: [image, video, document, null] }

    MessageSender:
      type: object
      required: [phoneNumberId, phone, displayName, status, wabaId, wabaLabel, tpsLimit, transport, usable, code, message, selected, compatibleTemplateIds]
      properties:
        phoneNumberId: { type: integer }
        phone: { type: string }
        displayName: { type: string }
        status: { type: string }
        wabaId: { type: ["integer", "null"] }
        wabaLabel: { type: ["string", "null"] }
        tpsLimit: { type: integer }
        transport: { type: ["string", "null"], enum: [workspace_credential, legacy_connector, local_mock, null] }
        usable: { type: boolean, description: "The number itself can send (connected, credential active, account bound)." }
        code: { type: string, description: "V2-04 reason code for the number itself." }
        message: { type: string }
        selected: { type: boolean }
        compatibleTemplateIds: { type: array, items: { type: integer }, description: "Selected templates this number can send (V2-04 decision)." }

    MessageTemplate:
      type: object
      required: [templateId, name, language, category, status, wabaId, wabaLabel, body, components, headerKind, selected, usable, code, message, compatibleSenderIds, requirements]
      properties:
        templateId: { type: integer }
        name: { type: string }
        language: { type: string }
        category: { type: string }
        status: { type: string }
        wabaId: { type: ["integer", "null"] }
        wabaLabel: { type: ["string", "null"] }
        body: { type: string }
        components: { type: array, items: { type: object, additionalProperties: true } }
        headerKind: { type: string, enum: [none, text, image, video, document] }
        selected: { type: boolean }
        usable: { type: boolean, description: "The template itself is a sendable Meta template (owned, provider-backed, approved, not removed, not a sample)." }
        code: { type: string }
        message: { type: string }
        compatibleSenderIds: { type: array, items: { type: integer }, description: "Selected numbers that can send this template (V2-04 decision)." }
        requirements: { type: array, items: { $ref: "#/components/schemas/MessageRequirement" } }

    MessageExecution:
      type: object
      required: [executable, code, message, assignments]
      properties:
        allocatorVersion: { type: string, enum: [v1, v2], description: "Which allocator this selection plans with (derived from distributionMode; never client-editable)." }
        executable: { type: boolean, description: "True when the current (allocator v1) engine can run this selection: each number sends one template and every template has a number." }
        code: { type: string, enum: [ok, no_senders, no_templates, needs_multi_template, incompatible] }
        message: { type: string }
        assignments:
          type: array
          description: "Which number sends which template under the current engine (empty when not executable)."
          items:
            type: object
            required: [phoneNumberId, templateId]
            properties:
              phoneNumberId: { type: integer }
              templateId: { type: integer }

    AudienceColumn:
      type: object
      required: [name, availability]
      properties:
        name: { type: string }
        availability: { type: string, enum: [all, some], description: "all: every completed upload of the active audience has this column; some: only some do (rows from the others have no value)." }

    CampaignMediaAsset:
      type: object
      required: [id, campaignId, fileName, contentType, byteLength, kind, status, createdAt]
      properties:
        id: { type: integer }
        campaignId: { type: integer }
        fileName: { type: string }
        contentType: { type: string }
        byteLength: { type: integer }
        kind: { type: string, enum: [image, video, document] }
        status: { type: string, enum: [ready, deleted] }
        createdAt: { type: string, format: date-time }

    MessageSetup:
      type: object
      required: [campaignId, revision, status, editable, reopenRequired, executionHistory, importInProgress, senders, sendersTruncated, templates, templatesTruncated, selection, mappings, execution, audienceGeneration, audienceColumns, mediaAssets]
      properties:
        campaignId: { type: integer }
        distributionMode: { type: ["string", "null"], enum: [equal_numbers, equal_templates, null] }
        revision: { type: integer }
        status: { type: string }
        editable: { type: boolean }
        editBlockedReason: { type: ["string", "null"] }
        reopenRequired: { type: boolean }
        executionHistory: { type: boolean }
        importInProgress: { type: boolean }
        senders: { type: array, items: { $ref: "#/components/schemas/MessageSender" } }
        sendersTruncated: { type: boolean }
        templates: { type: array, items: { $ref: "#/components/schemas/MessageTemplate" } }
        templatesTruncated: { type: boolean }
        selection:
          type: object
          required: [senderPhoneNumberIds, templateIds]
          properties:
            senderPhoneNumberIds: { type: array, items: { type: integer } }
            templateIds: { type: array, items: { type: integer } }
        mappings: { type: array, items: { $ref: "#/components/schemas/MessageMapping" } }
        execution: { $ref: "#/components/schemas/MessageExecution" }
        audienceGeneration: { type: integer }
        audienceColumns: { type: array, items: { $ref: "#/components/schemas/AudienceColumn" } }
        mediaAssets: { type: array, items: { $ref: "#/components/schemas/CampaignMediaAsset" } }

    MessageSetupInput:
      type: object
      required: [revision, senderPhoneNumberIds, templateIds, mappings]
      properties:
        revision: { type: integer, minimum: 0 }
        distributionMode:
          type: ["string", "null"]
          enum: [equal_numbers, equal_templates, null]
          description: "V2-06: omit to keep the current mode; null = allocator v1 (one template per number); equal_numbers / equal_templates = allocator v2 (one sender lane per number, any number of templates). Changing it is a setup edit (same lifecycle and revision fence)."
        senderPhoneNumberIds: { type: array, maxItems: 50, items: { type: integer } }
        templateIds: { type: array, maxItems: 50, items: { type: integer } }
        mappings: { type: array, maxItems: 2000, items: { $ref: "#/components/schemas/MessageMapping" } }

    DeliveryMode:
      type: string
      enum: [fastest_safe, balanced, conservative, advanced]
      description: "fastest_safe = min(provider rate, platform maximum); balanced = floor(60% of that), at least 1; conservative = max(5, floor(25%)) but never above it; advanced = a rate per number, validated, never clamped."

    DistributionMode:
      type: string
      enum: [equal_numbers, equal_templates]

    DeliveryNumberRate:
      type: object
      required: [phoneNumberId, messagesPerSecond]
      properties:
        phoneNumberId: { type: integer }
        messagesPerSecond: { type: integer, minimum: 1 }

    DeliverySettings:
      type: object
      required: [perNumberRates]
      properties:
        perNumberRates: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/DeliveryNumberRate" } }

    DeliveryNumberRateInput:
      type: object
      required: [phoneNumberId, messagesPerSecond]
      properties:
        phoneNumberId: { type: integer }
        messagesPerSecond: { type: number, description: "A whole number of messages per second, at least 1 and at most the number's maximum; validated server-side with a per-number error (never clamped)." }

    DeliverySettingsInput:
      type: object
      properties:
        perNumberRates: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/DeliveryNumberRateInput" } }

    DeliverySetupInput:
      type: object
      required: [revision, distributionMode, deliveryMode]
      properties:
        revision: { type: integer, minimum: 0, description: "The Message Studio setup revision this change was based on (distribution and sender lanes are one setup)." }
        distributionMode: { $ref: "#/components/schemas/DistributionMode" }
        deliveryMode: { $ref: "#/components/schemas/DeliveryMode" }
        deliverySettings: { $ref: "#/components/schemas/DeliverySettingsInput" }

    DeliverySender:
      type: object
      required: [phoneNumberId, phone, displayName, usable, providerApprovedRate, platformRate, effectiveCeiling, plannedRate, advancedRate, presetRates]
      properties:
        phoneNumberId: { type: integer }
        phone: { type: string }
        displayName: { type: string }
        usable: { type: boolean }
        providerApprovedRate: { type: integer, description: "The number's provider-approved messages per second." }
        platformRate: { type: integer, description: "The platform maximum messages per second." }
        effectiveCeiling: { type: ["integer", "null"], description: "min(provider-approved rate, platform maximum)." }
        plannedRate: { type: ["integer", "null"], description: "The rate planning would freeze for this number now (null = cannot be resolved; see problems)." }
        advancedRate: { type: ["integer", "null"], description: "The saved advanced rate for this number, if any." }
        presetRates:
          type: object
          description: "What each preset speed resolves to for this number (server-computed; the UI never re-derives rates)."
          required: [fastest_safe, balanced, conservative]
          properties:
            fastest_safe: { type: ["integer", "null"] }
            balanced: { type: ["integer", "null"] }
            conservative: { type: ["integer", "null"] }

    DeliverySetup:
      type: object
      required: [campaignId, revision, status, editable, editBlockedReason, distributionMode, deliveryMode, deliverySettings, senders, templateCount, totalMessagesPerSecond, recipients, estimatedDurationSeconds, platformMaxMessagesPerSecond, modeSummaries, problems]
      properties:
        campaignId: { type: integer }
        revision: { type: integer }
        status: { type: string }
        editable: { type: boolean }
        editBlockedReason: { type: ["string", "null"] }
        distributionMode: { type: ["string", "null"], enum: [equal_numbers, equal_templates, null] }
        deliveryMode: { type: ["string", "null"], enum: [fastest_safe, balanced, conservative, advanced, null] }
        deliverySettings: { $ref: "#/components/schemas/DeliverySettings" }
        senders: { type: array, items: { $ref: "#/components/schemas/DeliverySender" } }
        templateCount: { type: integer }
        totalMessagesPerSecond: { type: ["integer", "null"] }
        recipients: { type: integer, description: "Valid recipients of the active audience." }
        estimatedDurationSeconds: { type: ["integer", "null"], description: "ceil(recipients / total messages per second); a theoretical estimate, not a guarantee." }
        platformMaxMessagesPerSecond: { type: integer }
        modeSummaries:
          type: array
          description: "Total speed and estimate of each preset speed for the current numbers (server-computed)."
          items:
            type: object
            required: [deliveryMode, totalMessagesPerSecond, estimatedDurationSeconds]
            properties:
              deliveryMode: { $ref: "#/components/schemas/DeliveryMode" }
              totalMessagesPerSecond: { type: ["integer", "null"] }
              estimatedDurationSeconds: { type: ["integer", "null"] }
        problems: { type: array, items: { $ref: "#/components/schemas/PreflightIssue" } }

    PreflightIssueSubject:
      type: object
      properties:
        phoneNumberId: { type: integer }
        templateId: { type: integer }
        mediaAssetId: { type: integer }
        column: { type: string }
        routeId: { type: integer }

    PreflightIssue:
      type: object
      required: [code, severity, message, action, subject, technicalDetail]
      properties:
        code: { type: string, description: "Stable issue code from the preflight catalogue." }
        severity: { type: string, enum: [blocker, warning] }
        message: { type: string }
        action: { type: string }
        subject: { $ref: "#/components/schemas/PreflightIssueSubject" }
        technicalDetail: { type: ["string", "null"] }

    PreflightRecipients:
      type: object
      required: [audienceGeneration, total, valid, invalid, duplicate, suppressed, suppressedSinceImport]
      properties:
        audienceGeneration: { type: integer }
        total: { type: integer }
        valid: { type: integer, description: "Valid rows of the active audience (what Plan allocates)." }
        invalid: { type: integer }
        duplicate: { type: integer }
        suppressed: { type: integer, description: "Rows suppressed at import." }
        suppressedSinceImport: { type: integer, description: "Valid rows whose number has opted out since import (they will not be sent)." }

    PreflightSender:
      type: object
      required: [phoneNumberId, phone, displayName, status, setupState, quality, transport, usable, providerApprovedRate, effectiveCeiling, plannedRate, eligibleTemplateIds]
      properties:
        phoneNumberId: { type: integer }
        phone: { type: string }
        displayName: { type: string }
        status: { type: string }
        setupState: { type: string }
        quality: { type: ["string", "null"], description: "Provider quality rating when synced from the provider; null when unknown." }
        transport: { type: ["string", "null"] }
        usable: { type: boolean }
        providerApprovedRate: { type: integer }
        effectiveCeiling: { type: ["integer", "null"] }
        plannedRate: { type: ["integer", "null"] }
        eligibleTemplateIds: { type: array, items: { type: integer } }

    PreflightTemplate:
      type: object
      required: [templateId, name, language, status, headerKind, usable, eligibleSenderIds, missingVariables, missingColumns]
      properties:
        templateId: { type: integer }
        name: { type: string }
        language: { type: string }
        status: { type: string }
        headerKind: { type: string }
        usable: { type: boolean }
        eligibleSenderIds: { type: array, items: { type: integer } }
        missingVariables: { type: array, items: { type: string } }
        missingColumns: { type: array, items: { type: string } }

    PreflightCompatibilityProblem:
      type: object
      required: [phoneNumberId, templateId, code, message]
      properties:
        phoneNumberId: { type: integer }
        templateId: { type: integer }
        code: { type: string }
        message: { type: string }

    PreflightMedia:
      type: object
      required: [templateId, mediaAssetId, fileName, kind, expectedKind, status, ok, providerPrepared]
      properties:
        templateId: { type: integer }
        mediaAssetId: { type: ["integer", "null"] }
        fileName: { type: ["string", "null"] }
        kind: { type: ["string", "null"] }
        expectedKind: { type: string }
        status: { type: ["string", "null"] }
        ok: { type: boolean }
        providerPrepared: { type: boolean, description: "Every number that may send this template already has a provider copy of the file (otherwise Plan prepares it; not a blocker)." }

    PreflightSenderRate:
      type: object
      required: [phoneNumberId, effectiveCeiling, plannedRate]
      properties:
        phoneNumberId: { type: integer }
        effectiveCeiling: { type: ["integer", "null"] }
        plannedRate: { type: ["integer", "null"] }

    PreflightReport:
      type: object
      required: [campaignId, status, ready, evaluatedAt, recipients, senders, templates, distribution, delivery, compatibility, estimate, media, provider, health, warnings, blockers, technicalDetails]
      properties:
        campaignId: { type: integer }
        status: { type: string }
        ready: { type: boolean, description: "True when there is no blocker." }
        evaluatedAt: { type: string, format: date-time }
        recipients: { $ref: "#/components/schemas/PreflightRecipients" }
        senders: { type: array, items: { $ref: "#/components/schemas/PreflightSender" } }
        templates: { type: array, items: { $ref: "#/components/schemas/PreflightTemplate" } }
        distribution:
          type: object
          required: [mode, allocatorVersion]
          properties:
            mode: { type: ["string", "null"], enum: [equal_numbers, equal_templates, null] }
            allocatorVersion: { type: string, enum: [v1, v2] }
        delivery:
          type: object
          required: [mode, totalMessagesPerSecond, perSender]
          properties:
            mode: { type: ["string", "null"], enum: [fastest_safe, balanced, conservative, advanced, null] }
            totalMessagesPerSecond: { type: ["integer", "null"] }
            perSender: { type: array, items: { $ref: "#/components/schemas/PreflightSenderRate" } }
        compatibility:
          type: object
          required: [valid, problems]
          properties:
            valid: { type: boolean }
            problems: { type: array, items: { $ref: "#/components/schemas/PreflightCompatibilityProblem" } }
        estimate:
          type: object
          required: [messagesPerSecond, durationSeconds]
          properties:
            messagesPerSecond: { type: ["integer", "null"] }
            durationSeconds: { type: ["integer", "null"], description: "ceil(valid recipients / messages per second); theoretical, not a guaranteed completion time." }
        media: { type: array, items: { $ref: "#/components/schemas/PreflightMedia" } }
        provider:
          type: object
          required: [mode, status, health, ready]
          properties:
            mode: { type: string, description: "Workspace provider connection mode (mock or real) from stored state." }
            status: { type: ["string", "null"] }
            health: { type: ["string", "null"] }
            ready: { type: boolean }
        health:
          type: object
          required: [lastWebhookEventAt, lastProviderHealthAt]
          properties:
            lastWebhookEventAt: { type: ["string", "null"], format: date-time, description: "Most recent stored provider webhook event; null when none was received." }
            lastProviderHealthAt: { type: ["string", "null"], format: date-time }
        warnings: { type: array, items: { $ref: "#/components/schemas/PreflightIssue" } }
        blockers: { type: array, items: { $ref: "#/components/schemas/PreflightIssue" } }
        technicalDetails:
          type: object
          required: [allocatorVersion, platformMaxMessagesPerSecond, readinessErrors]
          properties:
            allocatorVersion: { type: string, enum: [v1, v2] }
            platformMaxMessagesPerSecond: { type: integer }
            readinessErrors: { type: array, items: { type: string }, description: "The exact strings GET .../readiness and Plan report." }

    MessagePreviewInput:
      type: object
      required: [templateId]
      properties:
        templateId: { type: integer }
        contactId: { type: integer, description: "A contact of the active audience; omitted = the first ready contact." }
        mappings:
          type: array
          maxItems: 200
          description: "Unsaved mappings for this template (the editor's current state); omitted = the saved mappings."
          items: { $ref: "#/components/schemas/MessageMapping" }

    MessagePreview:
      type: object
      required: [templateId, contact, resolved, headerMedia, unresolved]
      properties:
        templateId: { type: integer }
        contact:
          type: ["object", "null"]
          required: [id, normalizedPhone, rowNumber]
          properties:
            id: { type: integer }
            normalizedPhone: { type: ["string", "null"] }
            rowNumber: { type: integer }
        resolved:
          type: object
          required: [header, body, button]
          description: "Exactly the parameter values send preparation computes for this contact (shared resolver)."
          properties:
            header: { type: object, additionalProperties: { type: string } }
            body: { type: object, additionalProperties: { type: string } }
            button: { type: object, additionalProperties: { type: string } }
        headerMedia:
          type: ["object", "null"]
          required: [mediaAssetId, fileName, kind]
          properties:
            mediaAssetId: { type: integer }
            fileName: { type: string }
            kind: { type: string }
        unresolved:
          type: array
          items:
            type: object
            required: [key, reason]
            properties:
              key: { type: string }
              reason: { type: string, enum: [unmapped, empty_value, media_unavailable] }

    ApplyPresetInput:
      type: object
      required: [revision, presetId]
      properties:
        revision: { type: integer, minimum: 0 }
        presetId: { type: integer }
        templateIds: { type: array, items: { type: integer }, description: "Selected templates to apply to; omitted = every selected template." }
        overwrite: { type: boolean, default: false, description: "Replace existing mappings for matching slots; by default only empty slots are filled." }

    TestSendInput:
      type: object
      required: [phoneNumberId, templateId]
      properties:
        phoneNumberId: { type: integer }
        templateId: { type: integer }
        contactId: { type: integer, description: "Use this audience contact as the recipient and variable source." }
        recipientPhone: { type: string, description: "Or an explicit E.164 test number (+ and country code); variables then come from contactId or the first ready contact." }

    TestSendResult:
      type: object
      required: [result, message]
      properties:
        result: { type: string, enum: [sent, failed, unknown] }
        code: { type: ["string", "null"] }
        message: { type: string }
        providerMessageId: { type: ["string", "null"] }

    MappingPresetEntry:
      type: object
      required: [component, variable, source, sourceValue]
      properties:
        component: { type: string, enum: [header, body, button] }
        variable: { type: string }
        source: { type: string, enum: [csv, static] }
        sourceValue: { type: string, minLength: 1, maxLength: 512 }
        optional: { type: boolean, default: false }
        fallbackValue: { type: ["string", "null"] }

    MappingPreset:
      type: object
      required: [id, organizationId, name, entries, createdAt, updatedAt]
      properties:
        id: { type: integer }
        organizationId: { type: integer }
        name: { type: string }
        entries: { type: array, items: { $ref: "#/components/schemas/MappingPresetEntry" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MappingPresetInput:
      type: object
      required: [name, entries]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        entries: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/MappingPresetEntry" } }

    CampaignImageUploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, pattern: "^image/" }

    CampaignImageUpload:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }

    CampaignReadiness:
      type: object
      required: [campaignId, ready, errors]
      properties:
        campaignId: { type: integer }
        ready:
          type: boolean
          description: True only when every Plan/Execute readiness rule currently passes.
        errors:
          type: array
          description: The exact rule violations Plan/Execute would reject with right now, in the same wording.
          items: { type: string }

    CampaignMonitoring:
      type: object
      required: [campaignId, total, valid, invalid, deduplicated, suppressed, queued, processing, sent, delivered, read, failed, pending, retryCount, delayedRetries, staleLeases, deliveryUnknown, throttledRoutes, reconciliationRuns, effectiveConfiguredTps, routes, errorReasons]
      properties:
        campaignId: { type: integer }
        total: { type: integer }
        valid: { type: integer }
        invalid: { type: integer }
        deduplicated: { type: integer }
        suppressed: { type: integer }
        queued: { type: integer }
        processing: { type: integer }
        sent: { type: integer }
        delivered: { type: integer }
        read: { type: integer }
        failed: { type: integer }
        pending: { type: integer }
        retryCount: { type: integer }
        delayedRetries: { type: integer }
        staleLeases: { type: integer }
        deliveryUnknown: { type: integer }
        throttledRoutes: { type: integer }
        reconciliationRuns: { type: integer }
        effectiveConfiguredTps:
          type: integer
          description: Aggregate configured TPS after shared-phone provider caps are applied.
        estimatedCompletionAt: { type: ["string", "null"], format: date-time }
        errorReasons: { type: object, additionalProperties: { type: integer } }
        routes:
          type: array
          items:
            type: object
            required: [routeId, configuredTps, currentTps, queueDepth, status, sent, failed, errorReasons]
            properties:
              routeId: { type: integer }
              configuredTps: { type: integer }
              currentTps: { type: integer }
              queueDepth: { type: integer }
              status: { type: string }
              sent: { type: integer }
              failed: { type: integer }
              errorReasons: { type: object, additionalProperties: { type: integer } }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        details: { type: array, items: { type: string } }

    CampaignPlanSummary:
      type: object
      required: [planId, version, status, createdAt, routes, templates, mappings]
      properties:
        planId: { type: integer }
        allocatorVersion: { type: string, description: "v1 (historical: each route sends its own template) or v2 (one lane per number; each recipient's template comes from its allocation)." }
        distributionMode: { type: ["string", "null"] }
        deliveryMode: { type: ["string", "null"], description: "V2-06B speed mode frozen with the plan; null = the route configured rates were frozen." }
        allocationCounts:
          type: object
          description: "Recipients allocated by this plan, per sender lane, per template and per (lane, template) pair."
          properties:
            total: { type: integer }
            bySender:
              type: array
              items:
                type: object
                required: [routeId, phoneNumberId, count]
                properties: { routeId: { type: integer }, phoneNumberId: { type: integer }, count: { type: integer } }
            byTemplate:
              type: array
              items:
                type: object
                required: [templateId, count]
                properties: { templateId: { type: integer }, count: { type: integer } }
            byPair:
              type: array
              items:
                type: object
                required: [routeId, phoneNumberId, templateId, count]
                properties: { routeId: { type: integer }, phoneNumberId: { type: integer }, templateId: { type: integer }, count: { type: integer } }
        version: { type: integer }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        routes:
          type: array
          items:
            type: object
            required: [routeId, phoneNumberId, phone, displayName, templateId, configuredTps, providerTpsLimit]
            properties:
              wabaExternalId: { type: ["string", "null"] }
              eligibleTemplateIds:
                type: array
                items: { type: integer }
              eligibilityVerifiedAt: { type: ["string", "null"], format: date-time }
              eligibilitySource: { type: ["string", "null"] }
              sharedPhoneBudget: { type: boolean, description: "v2 sender lane: configuredTps is the number's whole budget, shared by all its templates." }
              eligibleTemplates:
                type: array
                description: "v2 lanes: per-template V2-04 evidence frozen at planning."
                items:
                  type: object
                  required: [templateId]
                  properties:
                    templateId: { type: integer }
                    verifiedAt: { type: ["string", "null"] }
                    source: { type: ["string", "null"] }
              routeId: { type: integer }
              phoneNumberId: { type: integer }
              phone: { type: ["string", "null"] }
              displayName: { type: ["string", "null"] }
              templateId: { type: integer }
              configuredTps: { type: integer }
              providerTpsLimit: { type: integer }
        templates:
          type: array
          items:
            type: object
            required: [id, name, language, body, headerKind, requiredVariables]
            properties:
              id: { type: integer }
              name: { type: string }
              language: { type: string }
              body: { type: string }
              headerKind: { type: string, enum: [none, text, image, video, document] }
              requiredVariables: { type: array, items: { type: string } }
        mappings: { type: array, items: { $ref: "#/components/schemas/TemplateMappingRecord" } }

    CampaignPlanRecipient:
      type: object
      required: [contactId, normalizedPhone, routeId, phoneNumberId, phone, templateId, templateName, resolvedParameters, renderedHeader, renderedBody]
      properties:
        contactId: { type: integer }
        normalizedPhone: { type: ["string", "null"] }
        routeId: { type: integer }
        phoneNumberId: { type: ["integer", "null"] }
        phone: { type: ["string", "null"] }
        templateId: { type: integer }
        templateName: { type: string }
        resolvedParameters:
          type: object
          additionalProperties: { type: object, additionalProperties: { type: string } }
        renderedHeader: { type: ["string", "null"] }
        renderedBody: { type: string }
        resolutionError:
          type: string
          description: Set when the frozen mapping snapshot can no longer resolve every required variable for this contact.

    CampaignPlanRecipientsSearchInput:
      type: object
      properties:
        search:
          type: string
          description: Case-insensitive match against the contact's phone number or any imported CSV field value
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
        offset: { type: integer, minimum: 0, default: 0 }

    CampaignPlanRecipientsPage:
      type: object
      required: [planId, planVersion, total, limit, offset, recipients]
      properties:
        planId: { type: integer }
        planVersion: { type: integer }
        total: { type: integer, description: Total recipients matching the search filter under the active plan }
        limit: { type: integer }
        offset: { type: integer }
        recipients:
          type: array
          items: { $ref: "#/components/schemas/CampaignPlanRecipient" }

    CampaignMessageRecord:
      type: object
      required: [jobId, contactId, phone, routeId, phoneNumberId, templateId, jobStatus, attempts, maxAttempts]
      properties:
        jobId: { type: integer }
        contactId: { type: ["integer", "null"] }
        phone: { type: ["string", "null"] }
        routeId: { type: ["integer", "null"] }
        phoneNumberId: { type: ["integer", "null"] }
        templateId: { type: ["integer", "null"] }
        templateName: { type: ["string", "null"] }
        jobStatus:
          type: string
          enum: [Queued, Processing, Throttled, Sent, Failed, Cancelled]
        attempts: { type: integer }
        maxAttempts: { type: integer }
        jobErrorReason: { type: ["string", "null"] }
        providerStatus: { type: ["string", "null"] }
        providerErrorReason: { type: ["string", "null"] }
        providerMessageId: { type: ["string", "null"] }
        acceptedAt: { type: ["string", "null"], format: date-time }
        lastStatusAt: { type: ["string", "null"], format: date-time }

    CampaignMessagesSearchInput:
      type: object
      properties:
        search:
          type: string
          description: >-
            Case-insensitive match against the recipient's phone number, the
            job-level error reason, or the provider-level error reason
        status:
          type: string
          enum: [Queued, Processing, Throttled, Sent, Failed, Cancelled]
          description: Filter to jobs currently in this status
        limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
        offset: { type: integer, minimum: 0, default: 0 }

    CampaignMessagesPage:
      type: object
      required: [total, limit, offset, messages]
      properties:
        total: { type: integer, description: Total send jobs matching the filters for this campaign }
        limit: { type: integer }
        offset: { type: integer }
        messages:
          type: array
          items: { $ref: "#/components/schemas/CampaignMessageRecord" }

    CampaignPlanPreviewInput:
      type: object
      properties:
        contactId: { type: integer }
        phone: { type: string, minLength: 1 }
      description: Provide exactly one of contactId or phone to look up the contact.

    CampaignPlanPreviewResult:
      type: object
      required: [contactId, normalizedPhone, planId, planVersion, routeId, phoneNumberId, phone, phoneDisplayName, configuredTps, providerTpsLimit, templateId, templateName, templateLanguage, resolvedParameters, renderedHeader, renderedBody]
      properties:
        contactId: { type: integer }
        normalizedPhone: { type: ["string", "null"] }
        planId: { type: integer }
        planVersion: { type: integer }
        routeId: { type: integer }
        phoneNumberId: { type: ["integer", "null"] }
        phone: { type: ["string", "null"] }
        phoneDisplayName: { type: ["string", "null"] }
        configuredTps: { type: ["integer", "null"] }
        providerTpsLimit: { type: ["integer", "null"] }
        templateId: { type: integer }
        templateName: { type: string }
        templateLanguage: { type: string }
        resolvedParameters:
          type: object
          additionalProperties: { type: object, additionalProperties: { type: string } }
        renderedHeader: { type: ["string", "null"] }
        renderedBody: { type: string }
        resolutionError:
          type: string
          description: Set when the frozen mapping snapshot can no longer resolve every required variable for this contact (e.g. a since-edited CSV row).
